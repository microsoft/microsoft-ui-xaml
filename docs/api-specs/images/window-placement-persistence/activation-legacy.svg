<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">Keep the existing Activate behavior after first presentation</title>
  <desc id="desc">Without a PlacementId or explicit preparation, the first Activate shows a window and requests activation. The app then minimizes it. A later Activate restores it and requests activation. Later calls use this same legacy path even if the first presentation used launch or restart behavior. Hiding a window does not reset first presentation. Activation requests are not foreground guarantees.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b;font-size:19px}.heading{font-size:26px;font-weight:600}.panel{font-size:22px;font-weight:600}.note{font-size:18px}.monitor{fill:#f6f8fa;stroke:#34495e;stroke-width:3}.app{fill:#d5ecff;stroke:#185a86;stroke-width:3}.bar{fill:#9bcdf1}.arrow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1120" height="550" fill="white"/>
  <text x="32" y="40" class="heading">Keep the existing Activate behavior after first presentation</text>
  <text x="32" y="85">Main example: no PlacementId and no explicit ApplyInitialPlacement.</text>
  <text x="44" y="133" class="panel">First Activate()</text>
  <text x="418" y="133" class="panel">App minimizes window</text>
  <text x="792" y="133" class="panel">Later Activate()</text>
  <rect x="44" y="157" width="284" height="222" class="monitor"/>
  <rect x="418" y="157" width="284" height="222" class="monitor"/>
  <rect x="792" y="157" width="284" height="222" class="monitor"/>
  <rect x="45" y="348" width="282" height="30" fill="#697681"/>
  <rect x="419" y="348" width="282" height="30" fill="#697681"/>
  <rect x="793" y="348" width="282" height="30" fill="#697681"/>
  <rect x="100" y="198" width="172" height="123" class="app"/>
  <rect x="102" y="200" width="168" height="28" class="bar"/>
  <text x="114" y="221">App</text>
  <rect x="467" y="351" width="86" height="24" fill="#9bcdf1"/>
  <text x="510" y="370" text-anchor="middle" class="note">App</text>
  <rect x="848" y="198" width="172" height="123" class="app"/>
  <rect x="850" y="200" width="168" height="28" class="bar"/>
  <text x="862" y="221">App</text>
  <path d="M350 266 H393" class="arrow"/>
  <path d="M724 266 H767" class="arrow"/>
  <text x="44" y="415" class="note">Shows; requests activation.</text>
  <text x="418" y="415" class="note">The window is minimized.</text>
  <text x="792" y="415" class="note">Restores; requests activation.</text>
  <text x="32" y="478">After launch or restart: later Activate() uses the same legacy path.</text>
  <text x="32" y="511">AppWindow.Hide() does not reset first presentation. Later Activate() does not rerun placement.</text>
</svg>
