<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Errors and fallback follow different paths</title>
  <desc id="desc">Three independent cases distinguish invalid calls from unavailable saved data and actual native placement failures. Invalid inputs, wrong-thread calls, and invalid call order report documented WinRT errors. A missing or unusable saved record permits fallback when no higher-priority source applies. Recovery and error reporting for a native failure after validation remain undecided. Separately, TryGetPlacement after close completes reports E_INVALID_OPERATION rather than null.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b;font-size:19px}.heading{font-size:26px;font-weight:600}.panel{font-size:22px;font-weight:600}.note{font-size:18px}.input{fill:#f6f8fa;stroke:#34495e;stroke-width:3}.arrow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1120" height="630" fill="white"/>
  <text x="32" y="40" class="heading">Errors and fallback follow different paths</text>
  <text x="32" y="85">Independent cases: a missing record is not the same as a failed call.</text>
  <rect x="44" y="120" width="432" height="96" rx="8" class="input"/>
  <text x="64" y="157" class="panel">Invalid input or call order</text>
  <text x="64" y="190" class="note">Also includes wrong-thread calls.</text>
  <path d="M500 168 H584" class="arrow"/>
  <rect x="620" y="120" width="456" height="96" rx="8" fill="#fff0f0" stroke="#9b2c2c" stroke-width="3"/>
  <text x="640" y="157" class="panel">WinUI reports the documented error</text>
  <text x="640" y="190" class="note">WinUI does not try another source.</text>
  <rect x="44" y="264" width="432" height="96" rx="8" class="input"/>
  <text x="64" y="301" class="panel">No usable saved record</text>
  <text x="64" y="334" class="note">No higher-priority source applies.</text>
  <path d="M500 312 H584" class="arrow"/>
  <rect x="620" y="264" width="456" height="96" rx="8" fill="#edf7ed" stroke="#3e6a45" stroke-width="3"/>
  <text x="640" y="301" class="panel">WinUI continues to fallback</text>
  <text x="640" y="334" class="note">Requested size, or existing / OS defaults.</text>
  <rect x="44" y="408" width="432" height="96" rx="8" class="input"/>
  <text x="64" y="445" class="panel">Native placement failure</text>
  <text x="64" y="478" class="note">Valid inputs already passed validation.</text>
  <path d="M500 456 H584" class="arrow"/>
  <rect x="620" y="408" width="456" height="96" rx="8" fill="#fff3cd" stroke="#8b4500" stroke-width="3"/>
  <text x="640" y="445" class="panel">Open policy decision</text>
  <text x="640" y="478" class="note">Agree on recovery and error reporting.</text>
  <text x="32" y="567">After close completes: TryGetPlacement() reports E_INVALID_OPERATION, not null.</text>
  <text x="32" y="600" class="note">This diagram does not define a new result type or native-failure HRESULT.</text>
</svg>
