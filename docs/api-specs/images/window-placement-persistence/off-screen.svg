<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">Reopen the app on a smaller display</title>
  <desc id="desc">At close, the app fits the old larger display. On reopen, a dashed outline shows its saved bounds extending outside the smaller display. The solid app window moves and shrinks to fit the current work area in this example.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b;font-size:19px}.heading{font-size:26px;font-weight:600}.panel{font-size:22px;font-weight:600}.note{font-size:18px}.monitor{fill:#f6f8fa;stroke:#34495e;stroke-width:3}.app{fill:#d5ecff;stroke:#185a86;stroke-width:3}.bar{fill:#9bcdf1}.saved{fill:none;stroke:#8b4500;stroke-width:3;stroke-dasharray:8 6}.arrow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1120" height="450" fill="white"/>
  <text x="32" y="40" class="heading">Reopen the app on a smaller display</text>
  <text x="32" y="85" class="panel">When the app closes</text>
  <text x="610" y="85" class="panel">When the app opens again</text>
  <text x="44" y="116">Old larger display</text>
  <rect x="44" y="132" width="450" height="250" class="monitor"/>
  <rect x="234" y="216" width="236" height="136" class="app"/>
  <rect x="236" y="218" width="232" height="28" class="bar"/>
  <text x="248" y="239">App</text>
  <rect x="45" y="356" width="448" height="25" fill="#697681"/>
  <path d="M530 252 H581" class="arrow"/>
  <text x="620" y="116">Current smaller display</text>
  <rect x="620" y="132" width="340" height="224" class="monitor"/>
  <rect x="621" y="330" width="338" height="25" fill="#697681"/>
  <rect x="810" y="216" width="236" height="136" class="saved"/>
  <rect x="712" y="186" width="220" height="126" class="app"/>
  <rect x="714" y="188" width="216" height="28" class="bar"/>
  <text x="726" y="209">App: adjusted</text>
  <text x="800" y="392" fill="#8b4500">Dashed: saved bounds</text>
  <path d="M918 374 L962 348" fill="none" stroke="#8b4500" stroke-width="2"/>
  <text x="44" y="423">App fits the old work area.</text>
  <text x="620" y="423">App fits the smaller work area.</text>
</svg>
