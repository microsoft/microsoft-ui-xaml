<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">Restart an app without requesting activation</title>
  <desc id="desc">At close, the app sits behind another app in the foreground. After an application restart, the app reopens in the background while the other app stays in front in this illustration.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b;font-size:19px}.heading{font-size:26px;font-weight:600}.panel{font-size:22px;font-weight:600}.note{font-size:18px}.monitor{fill:#f6f8fa;stroke:#34495e;stroke-width:3}.app{fill:#d5ecff;stroke:#185a86;stroke-width:3}.bar{fill:#9bcdf1}.other{fill:#dfe2e6;stroke:#58616b;stroke-width:3}.otherbar{fill:#bec5cc}.arrow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1120" height="450" fill="white"/>
  <text x="32" y="40" class="heading">Restart the app in the background</text>
  <text x="32" y="85" class="panel">When the app closes</text>
  <text x="610" y="85" class="panel">When the app opens again</text>
  <rect x="44" y="125" width="440" height="250" class="monitor"/>
  <rect x="45" y="337" width="438" height="37" fill="#697681"/>
  <rect x="75" y="149" width="285" height="161" class="app"/>
  <rect x="77" y="151" width="281" height="28" class="bar"/>
  <text x="89" y="172">App: background</text>
  <rect x="139" y="198" width="316" height="128" class="other"/>
  <rect x="141" y="200" width="312" height="28" class="otherbar"/>
  <text x="153" y="221">Other app: foreground</text>
  <path d="M530 250 H581" class="arrow"/>
  <rect x="620" y="125" width="440" height="250" class="monitor"/>
  <rect x="621" y="337" width="438" height="37" fill="#697681"/>
  <rect x="651" y="149" width="285" height="161" class="app"/>
  <rect x="653" y="151" width="281" height="28" class="bar"/>
  <text x="665" y="172">App: background</text>
  <rect x="715" y="198" width="316" height="128" class="other"/>
  <rect x="717" y="200" width="312" height="28" class="otherbar"/>
  <text x="729" y="221">Other app: foreground</text>
  <text x="44" y="418">Other app stays in front.</text>
  <text x="620" y="418">Application restart</text>
</svg>
