<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">The app looks approximately the same after display scaling changes</title>
  <desc id="desc">From the user's point of view, the app appears at approximately the same logical size and position after changing from 100 percent to 200 percent display scaling. Equal-sized display outlines and equal-sized app windows at the same relative offsets illustrate this apparent comparison, not a physical-pixel scale or an exact-position guarantee.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b;font-size:19px}.heading{font-size:26px;font-weight:600}.panel{font-size:22px;font-weight:600}.note{font-size:18px}.monitor{fill:#f6f8fa;stroke:#34495e;stroke-width:3}.app{fill:#d5ecff;stroke:#185a86;stroke-width:3}.bar{fill:#9bcdf1}.arrow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1120" height="450" fill="white"/>
  <text x="32" y="40" class="heading">Display scaling changes; the app looks approximately the same</text>
  <text x="32" y="85" class="panel">When the app closes</text>
  <text x="610" y="85" class="panel">When the app opens again</text>
  <text x="44" y="119">100% display scaling</text>
  <text x="620" y="119">200% display scaling</text>
  <rect x="44" y="136" width="440" height="252" class="monitor"/>
  <rect x="620" y="136" width="440" height="252" class="monitor"/>
  <rect x="45" y="362" width="438" height="25" fill="#697681"/>
  <rect x="621" y="362" width="438" height="25" fill="#697681"/>
  <rect x="160" y="192" width="240" height="140" class="app"/>
  <rect x="162" y="194" width="236" height="28" class="bar"/>
  <text x="174" y="215">App</text>
  <rect x="736" y="192" width="240" height="140" class="app"/>
  <rect x="738" y="194" width="236" height="28" class="bar"/>
  <text x="750" y="215">App</text>
  <path d="M530 252 H581" class="arrow"/>
  <text x="32" y="423">App looks approximately the same size and position.</text>
</svg>
