<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">Capture before teardown, not after close completes</title>
  <desc id="desc">For a window with valid windowed placement, capture can return a snapshot while the window is hidden or deactivated. The illustrated window remains hidden during synchronous capture inside Closed, before native teardown. After close completes, the window is gone and capture reports E_INVALID_OPERATION. Dashed windows show hidden geometry, not additional open windows. Normal-close capture alone does not cover the complete custom-storage lifecycle or session ending.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b;font-size:19px}.heading{font-size:26px;font-weight:600}.panel{font-size:22px;font-weight:600}.note{font-size:18px}.monitor{fill:#f6f8fa;stroke:#34495e;stroke-width:3}.app{fill:#d5ecff;stroke:#185a86;stroke-width:3}.hidden{fill:#d5ecff;fill-opacity:.55;stroke:#185a86;stroke-width:3;stroke-dasharray:8 6}.bar{fill:#9bcdf1}.arrow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1120" height="590" fill="white"/>
  <text x="32" y="40" class="heading">Capture before teardown, not after close completes</text>
  <text x="32" y="85">Start with a normal window and valid windowed placement.</text>
  <text x="44" y="133" class="panel">Before close</text>
  <text x="418" y="133" class="panel">Inside Closed callback</text>
  <text x="792" y="133" class="panel">Close completed</text>
  <rect x="44" y="160" width="284" height="220" class="monitor"/>
  <rect x="418" y="160" width="284" height="220" class="monitor"/>
  <rect x="792" y="160" width="284" height="220" class="monitor"/>
  <rect x="84" y="206" width="204" height="124" class="hidden"/>
  <text x="100" y="237">Hidden window</text>
  <rect x="458" y="206" width="204" height="124" class="hidden"/>
  <text x="472" y="229">Window still exists</text>
  <path d="M902 213 L966 277 M966 213 L902 277" fill="none" stroke="#697681" stroke-width="5"/>
  <text x="934" y="325" text-anchor="middle">Window gone</text>
  <path d="M350 270 H393" class="arrow"/>
  <path d="M724 270 H767" class="arrow"/>
  <text x="44" y="415" class="note">Capture returns placement.</text>
  <text x="44" y="445" class="note">Also valid after deactivation.</text>
  <text x="418" y="415" class="note">Capture synchronously,</text>
  <text x="418" y="445" class="note">before native teardown.</text>
  <text x="792" y="415" class="note">Capture reports</text>
  <text x="792" y="445" style="fill:#9b2c2c">E_INVALID_OPERATION</text>
  <rect x="32" y="482" width="1056" height="54" rx="8" fill="#fff3cd" stroke="#8b4500" stroke-width="2"/>
  <text x="52" y="516">Normal-close capture is not a complete custom-storage save lifecycle.</text>
  <text x="32" y="567" class="note">No session-ending hooks or save-only-on-close recommendation are implied.</text>
</svg>
