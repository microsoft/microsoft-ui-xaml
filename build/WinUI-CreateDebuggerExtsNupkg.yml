# 'MajorVersion' and 'MinorVersion' are automatically set by the version configs. Use unique
# 'DbgExt*' versions instead so the run can set whatever version is appropriate.
variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- name: Revision
  value: $[counter(format('{0}.{1}', variables['DbgExtMajorVersion'], variables['DbgExtMinorVersion']))]
- name: DbgExtMajorMinorVersion
  value: $[format('{0}.{1}', variables['DbgExtMajorVersion'], variables['DbgExtMinorVersion'])]

name: $(DbgExtMajorMinorVersion).$(Revision)
  
resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.Official.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked' # windows undocked
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: false
        python:
          enabled: false
        psscriptanalyzer:
          enable: false
      prefast:
        enabled: false

    stages:
    - stage: BuildDebuggerExtsNuget
      jobs:
      - job: BuildDebuggerExtsNuget
        pool:
          type: windows
        timeoutInMinutes: 30
        variables:
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
          ob_artifactBaseName: 'BuildPerf'
          ob_sdl_codeSignValidation_excludes: '-|packaging\**;-|**\Test\**;-|**\Taef\**;-|**\TestDependencies\**'
        steps:
        - template: AzurePipelinesTemplates/WindowsAppSDK-EsrpCodeSigning-Steps.yml@WindowsAppSDKConfig
          parameters:
            FolderPath: '$(Build.SourcesDirectory)\dbgext\xamlthread'
            Pattern: |
              xamlthread.js
            KeyCode: 'CP-230012'
            UseMinimatch: true
            DisplayName: 'CodeSign'

        - task: NuGetCommand@2
          displayName: 'Pack nupkg'
          inputs:
            command: 'pack'
            packagesToPack: '$(Build.SourcesDirectory)/dbgext/Microsoft.Internal.DbgExt-XamlThread.nuspec'
            packDestination: '$(ob_outputDirectory)'
            versioningScheme: 'byPrereleaseNumber'
            majorVersion: '$(DbgExtMajorVersion)'
            minorVersion: '$(DbgExtMinorVersion)'
            patchVersion: '$(Revision)'

        - template: AzurePipelinesTemplates/WindowsAppSDK-EsrpCodeSigning-Steps.yml@WindowsAppSDKConfig
          parameters:
            FolderPath: '$(ob_outputDirectory)'
            Pattern: |
              **/*.nupkg
            KeyCode: 'CP-401405'
            UseMinimatch: true
            DisplayName: 'CodeSign'

        - task: NuGetCommand@2
          displayName: 'NuGet push to feed'
          inputs:
            command: 'push'
            packagesToPush: '$(ob_outputDirectory)/*.nupkg'
            verbosityPush: 'Detailed'
            nuGetFeedType: 'internal'
            publishVstsFeed: 'WinUI/WinUI.DebuggerExtensions.XamlThread'
