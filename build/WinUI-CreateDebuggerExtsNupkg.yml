# 'MajorVersion' and 'MinorVersion' are automatically set by the version configs. Use unique
# 'DbgExt*' versions instead so the run can set whatever version is appropriate.
variables:
- template: AzurePipelinesTemplates\WinUI-Versions.yml
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- name: Revision
  value: $[counter(format('{0}.{1}', variables['DbgExtMajorVersion'], variables['DbgExtMinorVersion']))]
- name: DbgExtMajorMinorVersion
  value: $[format('{0}.{1}', variables['DbgExtMajorVersion'], variables['DbgExtMinorVersion'])]

name: $(DbgExtMajorMinorVersion).$(Revision)
  
resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WinAppSDK
      type: git
      name: OS/WinAppSDK
      ref: refs/heads/release/dev/monobuild

extends:
  template: v2/Microsoft.Official.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked' # windows undocked
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: false
        python:
          enabled: false
        psscriptanalyzer:
          enable: false
      prefast:
        enabled: false

    stages:
    - template: AzurePipelinesTemplates\WinUI-CreateDebuggerExts-Stage.yml
