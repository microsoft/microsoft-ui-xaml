#
# Scheduled lifetime-stress soak: build WinUI, then run the lifetime stress suite for an extended period to
# catch object-lifetime crashes. Same stages as Nightly plus the soak variables below; register/tune in ADO.

trigger: none
name: $(versionFinal)

schedules:
- cron: "0 7 * * *" # Daily at 07:00 UTC (outside of peak Nightly hours).
  displayName: Daily lifetime stress soak
  branches:
    include:
    - main
  always: true

parameters: # parameters show up in the ADO UI at build-queue time
- name: SignOutput
  type: boolean
  default: false
- name: runArm64Tests
  displayName: "Enable running tests on arm64"
  type: boolean
  default: false
- name: lifetimeStressMinutes
  displayName: "Minutes to soak each lifetime stress scenario"
  # RunTests has a ~90 min timeout and total time is roughly this x scenario count. For a longer soak, also
  # raise timeoutInMinutes in WinUI-RunTestPassOnPipeline-Job.yml.
  type: number
  default: 10

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- group: WinUI-Variable-Library
# The lifetime-stress soak builds WinUI only to run tests - it never ships the binaries, so it does not need
# PGO-optimized output. Disabling PGO keeps the build from depending on a matching
# Microsoft.Internal.PGO-Helpers.Cpp package (which is not published for these experimental soak builds and
# otherwise fails the native build with "Could not find matching PGO package"). Mirrors the GitHub-PR pipeline,
# which also builds with PGOBuildMode=Off.
- name: PGODisable
  value: 'true'
- name: pgoBuildMode
  value: 'Off'
# Soak mode: each scenario loops until this many minutes elapse instead of the default gate iteration count.
- name: WINUI_LIFETIME_STRESS_MINUTES
  value: ${{ parameters.lifetimeStressMinutes }}
# Aggressive native-crash repro variant of the native scenarios - the configuration that actually provokes a
# latent native lifetime crash. Only the scheduled soak sets it, so the PR gate keeps the light variant.
- name: WINUI_LIFETIME_STRESS_NATIVE
  value: 1

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked' # windows undocked
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: false
        python:
          enabled: false
        psscriptanalyzer:
          enable: false
      prefast:
        enabled: false
        break: true
      apiscan:
        enabled: false
        break: false
      binskim:
        enabled: true
        analyzeTargetGlob: $(BinskimExclusion)
        break: true
      policheck:
        exclusionsFile: $(Build.SourcesDirectory)\.config\PolicheckExclusions.xml

    stages:
    - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
      parameters:
        pipelineKind: Nightly
        signOutput: ${{ parameters.SignOutput }}
        runStaticAnalysis: false

    - template: AzurePipelinesTemplates\WinUI-RunTests-Stage.yml
      parameters:
        pipelineKind: Nightly
