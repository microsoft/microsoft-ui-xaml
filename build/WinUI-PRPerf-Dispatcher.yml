trigger: none
pr: none

schedules:
- cron: "*/5 * * * *"
  displayName: Discover run-perf PRs
  branches:
    include:
    - main
  always: true

parameters:
- name: pullRequestId
  type: number
  default: 0

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
    platform:
      name: windows_undocked
    git:
      submodules: false
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: false
        python:
          enabled: false
        psscriptanalyzer:
          enable: false
      prefast:
        enabled: false
      apiscan:
        enabled: false
      binskim:
        enabled: false

    stages:
    - stage: DispatchPRPerf
      displayName: Dispatch PR performance requests
      jobs:
      - job: DispatchPRPerf
        displayName: Dispatch PR performance requests
        pool:
          type: windows
        variables:
          ob_outputDirectory: $(Build.ArtifactStagingDirectory)
        steps:
        - checkout: self
          fetchDepth: 1
          fetchTags: false

        - task: PowerShell@2
          displayName: Discover and queue PR perf requests
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            PRPerfRepositoryId: $(Build.Repository.ID)
            PRPerfSourcePipelineId: $(PRPerfSourcePipelineId)
            PRPerfTargetPipelineId: $(PRPerfTargetPipelineId)
            PRPerfPipelineId: $(PRPerfPipelineId)
            PRPerfArtifactName: drop_amd64fre
          inputs:
            targetType: filePath
            filePath: $(Build.SourcesDirectory)\build\PRPerf\Dispatch-PRPerf.ps1
            ${{ if eq(parameters.pullRequestId, 0) }}:
              arguments: -Mode Discover -PullRequestId 0
            ${{ else }}:
              arguments: -Mode Single -PullRequestId ${{ parameters.pullRequestId }}
