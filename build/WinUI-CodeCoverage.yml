# Manual x86 Debug / Win11-25H2 run. Reuse QuickPR rather than add another build/test matrix.
trigger: none
pr: none
name: $(versionFinal)

parameters:
- name: CollectCodeCoverage
  displayName: "Collect runtime code coverage (experimental)"
  type: boolean
  default: false

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- group: WinUI-Variable-Library
- name: WindowsContainerImage
  value: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main
  - repository: WindowsAppSDKConfig
    type: git
    name: ProjectReunion/WindowsAppSDKConfig
    ref: refs/heads/main
  - repository: WindowsAppSDKVersionConfig
    type: git
    name: ProjectReunion/WindowsAppSDKConfig
    ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked'
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: true
        python:
          enabled: false
        psscriptanalyzer:
          enable: true
      prefast:
        enabled: false
      apiscan:
        enabled: false
      binskim:
        enabled: true
        analyzeTargetGlob: $(BinskimExclusion)
        break: true

    stages:
    - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
      parameters:
        pipelineKind: QuickPR
        collectCodeCoverage: ${{ parameters.CollectCodeCoverage }}
        runStaticAnalysis: false
        pgoBuildModeMSBuildArg: '/p:PGOBuildMode=Off'

    - template: AzurePipelinesTemplates\WinUI-RunTests-Stage.yml
      parameters:
        pipelineKind: QuickPR
        collectCodeCoverage: ${{ parameters.CollectCodeCoverage }}
