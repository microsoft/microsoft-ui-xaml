# This pipeline is a prototype for MSBuild project caching, an experimental feature to add
# build caching directly into MSBuild.
# See: https://github.com/dotnet/msbuild/blob/main/documentation/specs/project-cache.md
# This pipeline is intended to be a copy of WinUI-Pipeline, but with non-build steps removed and project caching enabled.

# Copyright (c) Microsoft Corporation.
# Licensed under the MIT License.

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- name: EnablePipelineCache
  value: true

name: $[format('{0:yyyyMMdd}.{1}', pipeline.startTime, variables['versionPrerelease'])]

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked' # windows undocked
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: false
        python:
          enabled: false
        psscriptanalyzer:
          enable: false
      prefast:
        enabled: false
      policheck:
        enabled: false

    stages:
    - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
      parameters:
        pipelineKind: Nightly
        projectCaching: true
