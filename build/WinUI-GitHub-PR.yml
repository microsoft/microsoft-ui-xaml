# GitHub-facing wrapper for Azure Pipelines PR validation.
#
# This file is intentionally separate from the internal Azure Repos PR pipeline
# so the existing ADO PR validation path can remain unchanged.

trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - main
    - winui3/main
    - feature/*
  drafts: true

name: WinUI-GitHub-PR_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: runFullValidation
  displayName: "Run full WinUI PR validation stages"
  type: boolean
  default: true
- name: MUXFinalRelease
  type: boolean
  default: false
- name: runArm64Tests
  displayName: "Enable running tests on arm64"
  type: boolean
  default: true
- name: runStaticAnalysis
  displayName: "Run Static Analysis (e.g., PREFast, APIScan)"
  type: boolean
  default: false
- name: runPerfTests
  displayName: "Enable the informational PR performance comparison stage"
  type: boolean
  default: true
# Fixture data is recorded against placeholder commits, so a fixture run can never be a
# measurement of the pull request under test. Defaulting this to true let a real PR receive
# a passing perf comment for a commit that was never measured.
- name: perfUseFixtures
  displayName: "Use recorded fixtures instead of measuring on perf hardware"
  type: boolean
  default: false

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- group: WinUI-Variable-Library
# Supplies the secret GitHubPRPerfToken used by the PR performance stage to post
# its results comment and commit status back to GitHub.
- group: WinUI-InternalFeed
- name: WindowsContainerImage
  value: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked'
    git:
      # Recursively check out submodules so the public github.com/microsoft/WinUI-Gallery
      # submodule (Samples/WinUIGallery) is available for GitHub PR sample-build validation.
      submodules: recursive
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: true
        python:
          enabled: false
        psscriptanalyzer:
          enable: true
      prefast:
        ${{ if eq(parameters.runStaticAnalysis, 'true') }}:
          enabled: true
        ${{ else }}:
          enabled: false
        break: true
      apiscan:
        enabled: false
        break: false
      binskim:
        enabled: true
        analyzeTargetGlob: $(BinskimExclusion)
        break: true

    stages:
    - stage: ValidateGitHubPrContext
      displayName: Validate GitHub PR context
      jobs:
      - job: ValidateGitHubPrContext
        displayName: Validate GitHub PR context
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.SourcesDirectory)\out'
        steps:
        - checkout: self
          submodules: false
          fetchDepth: 1
          fetchTags: false

        - task: PowerShell@2
          displayName: Validate GitHub PR context
          inputs:
            targetType: inline
            script: |
              $ErrorActionPreference = 'Stop'

              Write-Host "Build.Reason=$env:BUILD_REASON"
              Write-Host "Build.Repository.Provider=$env:BUILD_REPOSITORY_PROVIDER"
              Write-Host "Build.Repository.Name=$env:BUILD_REPOSITORY_NAME"
              Write-Host "Build.SourceBranch=$env:BUILD_SOURCEBRANCH"
              Write-Host "System.PullRequest.TargetBranch=$env:SYSTEM_PULLREQUEST_TARGETBRANCH"

              if ($env:BUILD_REPOSITORY_PROVIDER -notin @('GitHub', 'GitHubEnterprise')) {
                throw "Expected a GitHub-backed Azure Pipelines run, but Build.Repository.Provider was '$env:BUILD_REPOSITORY_PROVIDER'."
              }

              if ($env:BUILD_REASON -eq 'PullRequest') {
                $targetBranch = $env:SYSTEM_PULLREQUEST_TARGETBRANCH
                $allowedExactTargetBranches = @('main', 'winui3/main', 'refs/heads/main', 'refs/heads/winui3/main')
                $isAllowedFeatureBranch = $targetBranch -like 'feature/*' -or $targetBranch -like 'refs/heads/feature/*'
                if (($allowedExactTargetBranches -notcontains $targetBranch) -and -not $isAllowedFeatureBranch) {
                  throw "Unexpected GitHub PR target branch '$env:SYSTEM_PULLREQUEST_TARGETBRANCH'."
                }
              }

              Write-Host "GitHub PR context validation completed."

    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
        parameters:
          pipelineKind: GitHubPR
          buildScenarioApps: true
          MUXFinalRelease: ${{ parameters.MUXFinalRelease }}
          runStaticAnalysis: ${{ parameters.runStaticAnalysis }}
          pgoBuildModeMSBuildArg: '/p:PGOBuildMode=Off'
          buildProductOnly: false
          dependsOn: ValidateGitHubPrContext

    - ${{ if and(eq(parameters.runFullValidation, true), eq(parameters.MUXFinalRelease, false)) }}:
      - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
        parameters:
          stageName: Build_MUXFinalRelease
          pipelineKind: PR-2
          buildScenarioApps: false
          MUXFinalRelease: true
          runStaticAnalysis: ${{ parameters.runStaticAnalysis }}
          pgoBuildModeMSBuildArg: '/p:PGOBuildMode=Off'
          buildProductOnly: true
          dependsOn: ValidateGitHubPrContext

    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-RunTests-Stage.yml
        parameters:
          pipelineKind: PR

    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-RunStaticTests-Stage.yml
        parameters:
          MUXFinalRelease: ${{ parameters.MUXFinalRelease }}

    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-RunScenarioTests-Stage.yml
        parameters:
          pipelineKind: GitHubPR
          dependsOn: Build

    # Informational performance comparison. This stage is a leaf that no other
    # stage depends on, and its job sets continueOnError, so a perf failure can
    # never fail pull request validation. It runs only when the pull request
    # carries the 'run-perf' label. It deliberately declares no dependsOn: it
    # consumes no build output, so waiting on the product build would only
    # delay informational feedback by hours.
    - ${{ if eq(parameters.runPerfTests, true) }}:
      - template: AzurePipelinesTemplates\WinUI-PRPerf-Run.yml
        parameters:
          gateOnLabel: true
          continueOnError: true
          useFixtures: ${{ parameters.perfUseFixtures }}
          # The lab pool the pipeline's other test jobs already use, pinned to the same
          # image. The dedicated WinUI-PerfTest queue is not authorized for this pipeline
          # and its only agent is offline, which left the stage pending forever with no
          # error; this pool is authorized and reachable today. Shared lab hardware is
          # noisier than a dedicated perf box, which the run-to-run variation guard in
          # Compare-PRPerfFiles absorbs by reporting Inconclusive rather than a verdict.
          perfPoolName: WinDevPool-Test
          perfPoolDemands: ImageOverride -equals Win11-25H2
          # Real PR provenance, so that if fixture data is ever used on an actual pull request
          # the commit check in Compare-PRPerfFiles sees the mismatch and reports Inconclusive
          # instead of presenting recorded data as a measurement of this PR.
          pullRequestId: $(System.PullRequest.PullRequestNumber)
          sourceCommit: $(System.PullRequest.SourceCommitId)
          publishProvider: github
