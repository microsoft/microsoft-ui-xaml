# GitHub-facing wrapper for Azure Pipelines PR validation.
#
# This file is intentionally separate from the internal Azure Repos PR pipeline
# so the existing ADO PR validation path can remain unchanged.

trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - main
    - winui3/main
    - feature/*
  drafts: true

name: WinUI-GitHub-PR_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: runFullValidation
  displayName: "Run full WinUI PR validation stages"
  type: boolean
  default: true
- name: MUXFinalRelease
  type: boolean
  default: false
- name: runArm64Tests
  displayName: "Enable running tests on arm64"
  type: boolean
  default: true
- name: runStaticAnalysis
  displayName: "Run Static Analysis (e.g., PREFast, APIScan)"
  type: boolean
  default: false

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- group: WinUI-Variable-Library
# Secret PRBannedWords: banned-words list for the PR title/description check.
- group: WinUI-InternalFeed
- name: WindowsContainerImage
  value: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked'
    git:
      # Recursively check out submodules so the public github.com/microsoft/WinUI-Gallery
      # submodule (Samples/WinUIGallery) is available for GitHub PR sample-build validation.
      submodules: recursive
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: true
        python:
          enabled: false
        psscriptanalyzer:
          enable: true
      prefast:
        ${{ if eq(parameters.runStaticAnalysis, 'true') }}:
          enabled: true
        ${{ else }}:
          enabled: false
        break: true
      apiscan:
        enabled: false
        break: false
      binskim:
        enabled: true
        analyzeTargetGlob: $(BinskimExclusion)
        break: true

    stages:
    - stage: ValidateGitHubPrContext
      displayName: Validate GitHub PR context
      jobs:
      - job: ValidateGitHubPrContext
        displayName: Validate GitHub PR context
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.SourcesDirectory)\out'
        steps:
        - checkout: self
          submodules: false
          fetchDepth: 1
          fetchTags: false

        - task: PowerShell@2
          displayName: Validate GitHub PR context
          inputs:
            targetType: inline
            script: |
              $ErrorActionPreference = 'Stop'

              Write-Host "Build.Reason=$env:BUILD_REASON"
              Write-Host "Build.Repository.Provider=$env:BUILD_REPOSITORY_PROVIDER"
              Write-Host "Build.Repository.Name=$env:BUILD_REPOSITORY_NAME"
              Write-Host "Build.SourceBranch=$env:BUILD_SOURCEBRANCH"
              Write-Host "System.PullRequest.TargetBranch=$env:SYSTEM_PULLREQUEST_TARGETBRANCH"

              if ($env:BUILD_REPOSITORY_PROVIDER -notin @('GitHub', 'GitHubEnterprise')) {
                throw "Expected a GitHub-backed Azure Pipelines run, but Build.Repository.Provider was '$env:BUILD_REPOSITORY_PROVIDER'."
              }

              if ($env:BUILD_REASON -eq 'PullRequest') {
                $targetBranch = $env:SYSTEM_PULLREQUEST_TARGETBRANCH
                $allowedExactTargetBranches = @('main', 'winui3/main', 'refs/heads/main', 'refs/heads/winui3/main')
                $isAllowedFeatureBranch = $targetBranch -like 'feature/*' -or $targetBranch -like 'refs/heads/feature/*'
                if (($allowedExactTargetBranches -notcontains $targetBranch) -and -not $isAllowedFeatureBranch) {
                  throw "Unexpected GitHub PR target branch '$env:SYSTEM_PULLREQUEST_TARGETBRANCH'."
                }
              }

              Write-Host "GitHub PR context validation completed."

    # Scans the PR title and description for banned words; comments and fails the check on a match.
    - stage: ValidatePrContent
      displayName: Validate PR title and description
      dependsOn: []
      jobs:
      - job: ValidatePrContent
        displayName: Validate PR title and description
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.SourcesDirectory)\out'
          bannedWord: ''
          needComment: 'false'
        steps:
        - checkout: self
          submodules: false
          fetchDepth: 1
          fetchTags: false

        - task: PowerShell@2
          displayName: Scan PR title and description for banned words
          env:
            BANNED_WORDS: $(PRBannedWords)
          inputs:
            targetType: inline
            script: |
              $ErrorActionPreference = 'Stop'
              $ProgressPreference = 'SilentlyContinue'

              if ($env:BUILD_REASON -ne 'PullRequest') {
                Write-Host "Not a pull request build (Build.Reason=$env:BUILD_REASON). Skipping PR content validation."
                return
              }

              $repo = $env:BUILD_REPOSITORY_NAME
              $prNumber = $env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER
              Write-Host "Repository: $repo"
              Write-Host "Pull request number: $prNumber"

              if ([string]::IsNullOrEmpty($prNumber)) {
                Write-Host "##vso[task.logissue type=error]No GitHub pull request number available to validate."
                Write-Host "##vso[task.complete result=Failed;]Missing PR number."
                return
              }

              # Fail if the list is missing so an empty regex can't match every PR.
              if ([string]::IsNullOrWhiteSpace($env:BANNED_WORDS)) {
                Write-Host "##vso[task.logissue type=error]Banned-words list is empty or not available to this pipeline."
                Write-Host "##vso[task.complete result=Failed;]Banned-words list not configured."
                return
              }

              $headers = @{
                'User-Agent' = 'winui-pr-content-check'
                Accept       = 'application/vnd.github+json'
              }

              # This repo is public, so PR content is read without authentication.
              $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/pulls/$prNumber" -Headers $headers -Method Get

              # Skip automated bot PRs (e.g. dotnet-maestro[bot]) so they aren't blocked.
              if ($pr.user.type -eq 'Bot') {
                Write-Host "Automated bot PR detected (user.login=$($pr.user.login)). Skipping checks."
                return
              }

              $prTitle = [string]$pr.title
              $prBody  = [string]$pr.body
              Write-Host "Title: $prTitle"

              # Turn the comma-separated list into a regex alternation.
              $Regex = $env:BANNED_WORDS
              $Regex = $Regex -replace ',$', ''
              $Regex = $Regex -replace ',,', ','
              $Regex = $Regex.Replace(',', '|')

              $content = "$prTitle`n$prBody"
              if ($content -notmatch $Regex) {
                Write-Host "SUCCESS: The PR title and description do not contain banned words."
                return
              }

              $banned = $matches[0]
              Write-Host "##vso[task.logissue type=error]Pull request title or description contains one or more banned words: $banned"
              Write-Host "##vso[task.setvariable variable=bannedWord]$banned"

              # Marker so re-runs don't post duplicate comments.
              $marker = "<!-- winui-pr-content-policheck -->"
              $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$prNumber/comments" -Headers $headers -Method Get
              $alreadyPosted = $false
              foreach ($c in $existing) {
                if ($c.body -like "*$marker*") { $alreadyPosted = $true; break }
              }
              if ($alreadyPosted) {
                Write-Host "Banned-word comment already present on PR #$prNumber."
              } else {
                Write-Host "##vso[task.setvariable variable=needComment]true"
              }

        # Post the comment via the WinUI GitHub service connection.
        - task: GitHubComment@0
          displayName: Comment on PR about banned words
          condition: and(succeeded(), eq(variables['needComment'], 'true'))
          inputs:
            gitHubConnection: 'WinUI'
            repositoryName: '$(Build.Repository.Name)'
            id: '$(System.PullRequest.PullRequestNumber)'
            comment: |
              <!-- winui-pr-content-policheck -->
              :no_entry: This PR's title or description contains a word that should not be shared publicly (for example a company or product name). Banned word found: **$(bannedWord)**. Please update the PR title/description so it is safe to share publicly, then re-run the check.

        - task: PowerShell@2
          displayName: Fail the check if banned words were found
          condition: and(always(), ne(variables['bannedWord'], ''))
          inputs:
            targetType: inline
            script: |
              Write-Host "##vso[task.logissue type=error]Pull request contains banned words: $(bannedWord)"
              Write-Host "##vso[task.complete result=Failed;]Pull request contains banned words."


    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
        parameters:
          pipelineKind: GitHubPR
          buildScenarioApps: true
          MUXFinalRelease: ${{ parameters.MUXFinalRelease }}
          runStaticAnalysis: ${{ parameters.runStaticAnalysis }}
          pgoBuildModeMSBuildArg: '/p:PGOBuildMode=Off'
          buildProductOnly: false
          dependsOn: ValidateGitHubPrContext

    - ${{ if and(eq(parameters.runFullValidation, true), eq(parameters.MUXFinalRelease, false)) }}:
      - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
        parameters:
          stageName: Build_MUXFinalRelease
          pipelineKind: PR-2
          buildScenarioApps: false
          MUXFinalRelease: true
          runStaticAnalysis: ${{ parameters.runStaticAnalysis }}
          pgoBuildModeMSBuildArg: '/p:PGOBuildMode=Off'
          buildProductOnly: true
          dependsOn: ValidateGitHubPrContext

    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-RunTests-Stage.yml
        parameters:
          pipelineKind: PR

    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-RunStaticTests-Stage.yml
        parameters:
          MUXFinalRelease: ${{ parameters.MUXFinalRelease }}

    - ${{ if eq(parameters.runFullValidation, true) }}:
      - template: AzurePipelinesTemplates\WinUI-RunScenarioTests-Stage.yml
        parameters:
          pipelineKind: GitHubPR
          dependsOn: Build
