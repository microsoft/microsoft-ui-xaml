# Temporary validation pipeline proving that a GitHub-owned template can use
# WinUIInternalFeedUri without importing a template from @WinUIInternal.

trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - main
    - winui3/main
    - feature/*
  drafts: true

name: WinUI-GitHub-FeedVariableValidation_$(Date:yyyyMMdd)$(Rev:.r)

variables:
- group: WinUI-InternalFeed
- name: WindowsContainerImage
  value: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked'
    git:
      submodules: false
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: false
        python:
          enabled: false
        psscriptanalyzer:
          enable: false
      prefast:
        enabled: false
      apiscan:
        enabled: false
      binskim:
        enabled: false

    stages:
    - stage: ValidateInternalFeedVariable
      displayName: Validate internal feed variable
      condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
      jobs:
      - job: DownloadPrivatePackage
        displayName: Download private package
        pool:
          type: windows
        variables:
          packagesDir: '$(Agent.TempDirectory)\WinUI-FeedVariableValidation\packages'
          ob_outputDirectory: '$(Build.SourcesDirectory)\out'
        steps:
        - checkout: self
          submodules: false
          fetchDepth: 1
          fetchTags: false

        - task: NuGetAuthenticate@1
          displayName: Authenticate to Azure Artifacts

        - task: NuGetCommand@2
          displayName: Download WinMDVersionVerifyLcr 1.0.2 through WinUIInternalFeedUri
          inputs:
            command: custom
            arguments: 'install WinMDVersionVerifyLcr -Version 1.0.2 -OutputDirectory "$(packagesDir)" -Source "$(WinUIInternalFeedUri)" -NoCache -DirectDownload -NonInteractive'

        - task: PowerShell@2
          displayName: Verify package download
          inputs:
            targetType: inline
            pwsh: true
            script: |
              $verifier = Get-ChildItem -Path '$(packagesDir)' -Filter WinMDVersionVerifyLcr.exe -Recurse |
                Select-Object -First 1

              if (-not $verifier) {
                throw "WinMDVersionVerifyLcr.exe was not found under $(packagesDir)."
              }

              Write-Host "Successfully downloaded WinMDVersionVerifyLcr 1.0.2 from the internal feed."
