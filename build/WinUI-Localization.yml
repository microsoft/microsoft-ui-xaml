parameters: # parameters are shown up in ADO UI in a build queue time
- name: PublishToMaestro
  type: boolean
  default: false

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- group: WinUITeamKeyVault-Secrets
- group: WinUI-Variable-Library

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.Official.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked' # windows undocked
    globalsdl:
      tsa:
        enabled: false
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: false
        python:
          enabled: false
        psscriptanalyzer:
          enable: false
      prefast:
        enabled: false
      apiscan:
        # We are enabling APIScan on a per job basis, as this scanner is not applicable to most jobs.
        enabled: false
        # Note: Once existing errors are cleared, consider setting this to true.
        break: false
      binskim:
        enabled: true
        analyzeTargetGlob: $(BinskimExclusion)
        break: true
      policheck:
        enabled: false
        exclusionsFile: $(Build.SourcesDirectory)\.config\PolicheckExclusions.xml

    stages:
    - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
      parameters:
        pipelineKind: Localization
        signOutput: true # this is true for official builds
        runStaticAnalysis: false

    - template: AzurePipelinesTemplates\WinUI-Localization-Stage.yml
      parameters:
        pipelineKind: Localization
        buildArtifactsDirectory: $(Build.SourcesDirectory)\BuildOutput
        publishToMaestro: ${{ parameters.PublishToMaestro }}