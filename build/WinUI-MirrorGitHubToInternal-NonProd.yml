# THROWAWAY / NON-PROD test pipeline for the consolidated GitHub->ADO mirror + integrate flow.
# NOT for production. Delete after e2e validation is complete.
#
# trigger: none  -> must be queued MANUALLY on the source test branch
# (user/gpaskaleva/mirror-e2e) so Build.SourceVersion binds to the mirror source tip
# and the ExpectedSourceCommit containment guard is satisfied.
#
# Mirror stage:    user/gpaskaleva/mirror-e2e (GitHub)
#               -> user/gpaskaleva/github-internal-main-test (ADO)
# Integrate stage: user/gpaskaleva/github-internal-main-test
#               -> user/gpaskaleva/mirror-integration-target-bootstrap (bootstrap-based => clean merge)

trigger: none
pr: none

variables:
- group: WinUI-InternalFeed
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: targetRepository
      type: git
      name: WinUI/microsoft-ui-xaml-lift
      ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      ensureArtifactsDirExists: true
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked'
    git:
      submodules: false
      persistCredentials: true

    stages:
    - template: AzurePipelinesTemplates\WinUI-MirrorGitHubToInternal-Stage.yml@self
      parameters:
        sourceBranchName: user/gpaskaleva/mirror-e2e
        targetBranchName: user/gpaskaleva/github-internal-main-test
    - template: AzurePipelinesTemplates\WinUI-PublicMirrorMerge-Stage.yml@self
      parameters:
        sourceBranchName: user/gpaskaleva/github-internal-main-test
        targetBranchName: user/gpaskaleva/mirror-integration-target-bootstrap
        dependsOnStage: Source
        checkoutRepository: targetRepository
