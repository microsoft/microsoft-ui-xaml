trigger: none
name: $(versionFinal)

parameters: # parameters are shown up in ADO UI in a build queue time
- name: PublishToMaestro
  type: boolean
  default: true
- name: MUXFinalRelease
  displayName: "Final Release (check for Preview/Stable to remove experimental APIs, uncheck for Experimental)"
  type: boolean
  default: false
- name: runStaticAnalysis
  displayName: "Run Static Analysis (e.g., PREFast, APIScan)"
  type: boolean
  default: true
- name: CheckApiChanges
  displayName: "Run Api Diff against latest stable package"
  type: boolean
  default: true
- name: sourceValidationOnly
  displayName: "Validate public GitHub source without building or publishing"
  type: boolean
  default: false
- name: expectedSourceBranch
  displayName: "Expected GitHub branch name or full ref for source-only validation"
  type: string
  default: ''

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml
- group: WinUITeamKeyVault-Secrets  # NOTE: Only the WinUI-Xaml-Nightly,
                                    # and WinUI-Xaml-Official pipelines have access
                                    # to this variable group
- group: WinUI-Variable-Library

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.Official.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked' # windows undocked
    globalsdl:
      tsa:
        enabled: true
      enableXFGCheck: false
      codeql:
        tsandjs:
          enabled: true
        python:
          enabled: false
        psscriptanalyzer:
          enable: true
      prefast:
        ${{ if eq(parameters.runStaticAnalysis, 'true') }}:
          enabled: true
        ${{ else }}:
          enabled: false
        break: true
      apiscan:
        # We are enabling APIScan on a per job basis, as this scanner is not applicable to most jobs.
        enabled: false
        # Note: Once existing errors are cleared, consider setting this to true.
        break: false
      binskim:
        enabled: true
        analyzeTargetGlob: $(BinskimExclusion)
        break: true
      policheck:
        exclusionsFile: $(Build.SourcesDirectory)\.config\PolicheckExclusions.xml

    stages:
    - ${{ if eq(parameters.sourceValidationOnly, true) }}:
      - template: AzurePipelinesTemplates\WinUI-ValidateGitHubSource-Stage.yml
        parameters:
          expectedSourceBranch: ${{ parameters.expectedSourceBranch }}

    - ${{ else }}:
      - template: AzurePipelinesTemplates\WinUI-BuildWinUI-Stage.yml
        parameters:
          pipelineKind: Nightly
          signOutput: true
          MUXFinalRelease: ${{ parameters.MUXFinalRelease }}
          runStaticAnalysis: ${{ parameters.runStaticAnalysis }}

      - template: AzurePipelinesTemplates\WinUI-BuildScenarioApps-Stage.yml
        parameters:
          pipelineKind: Nightly
          MUXFinalRelease: ${{ parameters.MUXFinalRelease }}
          runStaticAnalysis: ${{ parameters.runStaticAnalysis }}

      - template: AzurePipelinesTemplates\WinUI-RunScenarioTests-Stage.yml
        parameters:
          pipelineKind: Nightly
          dependsOn: BuildScenarioApps
          runArm64Tests: true

      - template: AzurePipelinesTemplates\WinUI-RunTests-Stage.yml
        parameters:
          pipelineKind: Nightly

      - template: AzurePipelinesTemplates\WinUI-RunStaticTests-Stage.yml
        parameters:
          MUXFinalRelease: ${{ parameters.MUXFinalRelease }}

      - template: AzurePipelinesTemplates\WinUI-Packaging-Stage.yml
        parameters:
          signOutput: true
          publishToMaestro: ${{ parameters.PublishToMaestro }}

      - ${{ if eq( parameters.CheckApiChanges, true ) }}:
        - template: AzurePipelinesTemplates\WinUI-CheckApiChanges-Stage.yml
