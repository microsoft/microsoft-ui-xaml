#
# WinUI-BuildMUXProject-Steps.yml
#
# Step template for building Microsoft.UI.Xaml.sln (full controls solution),
# Microsoft.UI.Xaml-Product.sln (shipping product solution), and optionally
# MUXControls.sln (test infra). Used by BOTH the standalone WinUI pipelines
# (PR / Official / Nightly) AND the WindowsAppSDK monobuild pipeline.
#
# Caller distinguishes via the IsMonobuild parameter (default false). When
# IsMonobuild=true the template uses the monobuild-coherent version coming
# from WindowsAppSDK-DetermineVersion-Steps.yml, restores from the staged
# local feed + the standalone WinUI.Dependencies feed (so the BUILD compiles
# against the same pinned upstream binaries as the standalone build —
# mirrors Foundation's monobuild pattern, which does NOT inject monobuild-
# coherent upstream versions at BUILD time; that injection happens at PACK
# time in WinUI-CreateTransportNupkg-Steps.yml via the monobuildPinnedVersion
# parameter), and skips the standalone-
# only mock-package / scenario-apps / ESRP steps (in the monobuild, WinUI binaries are signed
# per-platform in the monorepo's WinUI-Build-Stage.yml).
#
# This file replaces the prior parallel WinUI-MonoBuild-BuildMUXProject-Steps.yml
# (since deleted) per the reuse pattern used by Foundation/Widgets.

parameters:
  # NOTE: Parameters below are intentionally declared in untyped (legacy) form to preserve the
  # historical contract where downstream conditional checks (and callers in this and other repos)
  # use string comparisons like `eq(parameters.buildProductOnly, 'false')` and
  # `eq(parameters.runStaticAnalysis, 'true')`. Switching them to `type: boolean` causes
  # `eq(false, 'false')` to evaluate FALSE (no string coercion happens for typed booleans) —
  # which silently skips Microsoft.UI.Xaml.sln, MUXControls.sln, and other gated steps.
  # Untyped string values keep coercion intact for ALL existing comparisons.
  # Mixing typed + untyped in one parameters block is not allowed; we keep the whole block
  # untyped for consistency. New monobuild-specific parameters added below for the same reason.
  buildArtifactsDirectory: $(Build.SourcesDirectory)\BuildOutput
  additionalMSBuildOptions: ''
  pipelineKind: ''
  buildScenarioApps: false
  signOutput: false
  MUXFinalRelease: false
  runStaticAnalysis: true
  projectCaching: false
  buildProductOnly: false
  # When set (mono-build test pipeline only), download the WinUI product from the parent mono-build
  # instead of rebuilding it: for Release x86/x64/arm64 jobs, skip the Microsoft.UI.Xaml.sln product
  # build and lay the mono-build's Build-WinUI-<plat>-Release output into BuildOutput\bin so
  # MUXControls.sln (test) + scenario apps consume it via eng\consumebinaries.targets. Empty
  # (default) = standalone behavior (build the product). Debug and arm64ec jobs always build the
  # product (the mono-build publishes Release x86/x64/arm64 only).
  consumeProductFromBuildId: ''
  consumeProductFromPipeline: ''
  pgoBuildModeMSBuildArg: '/p:PGOBuildMode=$(pgoBuildMode)'
  IsMonobuild: false
  IsOfficial: false
  # Version string injected into the Product .sln msbuild as /p:WinUIVersion.
  # Standalone defaults to $(versionFinal) (computed locally by GenerateVersionInfo earlier in
  # the job). Monobuild caller passes $(WindowsAppSDKFormattedVersion) so the produced binaries
  # carry the monobuild-coherent version.
  winUIVersion: '$(versionFinal)'
  # Product version macros baked into dxaml/xcp/inc/WindowsAppSDK-ProductInfo.h. Standalone
  # uses $(MajorVersion)/$(MinorVersion) from WinUI's Versions.yml (currently 3 / 0). Monobuild
  # caller passes literals '3' / '0' because the monobuild's MajorVersion/MinorVersion variables
  # describe the Foundation version schema (currently 0 / 0), not the WinUI product version
  # schema.
  productMajor: '$(MajorVersion)'
  productMinor: '$(MinorVersion)'
  # Suffix appended to the staged-bin output folder. Standalone uses bare '\drop' (single-
  # platform standalone build). Monobuild caller passes '_$(buildOutput)$(normalizedConfiguration)'
  # so the PackWinUI job can consume three per-platform artifacts
  # (Build-WinUI-{x86,x64,arm64}-Release) without collisions.
  dropSuffix: ''
  # Declared so the cleanup rmdir at end of build can reference them in BOTH standalone and
  # monobuild paths. Standalone leaves them empty (matching the pre-refactor undeclared-
  # parameter behavior, which silently produced `if exist  rmdir /s /q ` no-ops). Monobuild
  # path uses .dotnet only.
  msbuildInstallDir: ''
  msbuildInstallLogsDir: ''

steps:
  - task: NuGetAuthenticate@1

  # Set values of common build variables
  - powershell: |
      $buildConfigTable = @{ "chk" = "Debug"; "fre" = "Release"}
      $buildConfiguration = $buildConfigTable[$env:normalizedConfiguration]

      Write-Host "buildConfiguration = $buildConfiguration"
      Write-Host "versionFinal = $env:versionFinal"
      Write-Host "WindowsAppSDKFormattedVersion = $env:WindowsAppSDKFormattedVersion"
      Write-Host "##vso[task.setvariable variable=buildConfiguration;]$buildConfiguration"

      # PublishAot must be specified at restore, as it conditionally generates nuget.g.* imports
      $publishAot = $env:buildConfiguration -eq "Release" -and $env:buildPlatform -ne "x86"
      Write-Host "##vso[task.setvariable variable=publishAotValue;]$publishAot"

      if ($env:BUILD_REPOSITORY_PROVIDER -in @("GitHub", "GitHubEnterprise"))
      {
        Write-Host "Disabling PGO for GitHub-backed validation."
        Write-Host "##vso[task.setvariable variable=PGODisable;]true"
        Write-Host "##vso[task.setvariable variable=pgoBuildMode;]Off"
      }
    displayName: Set computed variables

  # Cleans anything left over from previous builds (including VS build tools) and installs NuGet
  - template: WinUI-InitializeMachineState-Steps.yml

  # Ensure the VS preinstalled on the image is up-to-date, or install the VS build tools if enableVsBuildTools=true. Also installs latest build tools preview if pipelineKind = Preview
  - template: WinUI-Install-MSBuildTools.yml
    parameters:
      msbuildInstallDir: '$(_buildToolsDirectory)'
      msbuildInstallLogsDir: '$(_buildToolsInstallLogsDirectory)'
      pipelineKind: ${{ parameters.pipelineKind }}

  - task: CmdLine@2
    displayName: Set up environment
    inputs:
      script: |
        $(Build.SourcesDirectory)\init.cmd /pipeline $(buildPlatform)$(normalizedConfiguration) $(_dotNetFrameworkVersionInitParam)

  - task: PowerShell@2
    displayName: GenerateVersionInfo
    inputs:
      filePath: '$(REPOROOT)\build\PipelineScripts\GenerateVersionInfo.ps1'
      arguments: >
        -ProductMajor "${{ parameters.productMajor }}"
        -ProductMinor "${{ parameters.productMinor }}"
        -VersionInfoPath "$(REPOROOT)\dxaml\xcp\inc\WindowsAppSDK-ProductInfo.h"

  - script: |
      echo ##vso[task.setvariable variable=pgoBuildMode]Optimize
    condition: and(eq(variables['shouldPgo'], 'true'), ne(variables['PGODisable'], 'true'), ne(variables['Build.Repository.Provider'], 'GitHub'), ne(variables['Build.Repository.Provider'], 'GitHubEnterprise'))
    displayName: Enable PGO

  # The consumed WinUI bits were built against the mono-build's source-built component set, not the
  # eng\Versions.props fallbacks. Stage the mono-build's Base/Foundation/IXP(+FrameworkUdk)/WinUIDetails
  # nupkgs into the local packagestore and pin WindowsAppSDKVersionPinned to their version, so every
  # later restore resolves the matching versions (stale versions => CS0012 in the generated CsWinRT
  # projections). This must precede WinUI-InstallDependencies-Steps.yml: that template restores the
  # component packages at these versions, so pinning afterwards leaves the build looking for a version
  # that was never restored (W1007 on the Foundation transport winmd).
  - ${{ if ne(parameters.consumeProductFromBuildId, '') }}:
    - task: DownloadPipelineArtifact@2
      displayName: 'Consume product: download mono-build component packages'
      condition: and(succeeded(), eq(variables['normalizedConfiguration'],'fre'), in(variables['buildPlatform'],'x86','x64','arm64'))
      inputs:
        source: specific
        runVersion: specific
        project: $(System.TeamProjectId)
        pipeline: ${{ parameters.consumeProductFromPipeline }}
        pipelineId: ${{ parameters.consumeProductFromBuildId }}
        patterns: |
          Component-Base-Final/**/*.nupkg
          Component-Foundation-Final/**/*.nupkg
          Component-InteractiveExperiences-Final/**/*.nupkg
          Component-WinUIDetails-Final/**/*.nupkg
        targetPath: $(Build.ArtifactStagingDirectory)\MonobuildComponents
    - task: PowerShell@2
      displayName: 'Consume product: stage component packages + pin version'
      condition: and(succeeded(), eq(variables['normalizedConfiguration'],'fre'), in(variables['buildPlatform'],'x86','x64','arm64'))
      inputs:
        targetType: inline
        script: |
          Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          $src = "$(Build.ArtifactStagingDirectory)\MonobuildComponents"
          $store = "$(Build.SourcesDirectory)\packagestore"
          New-Item -ItemType Directory -Force -Path $store | Out-Null
          $nupkgs = @(Get-ChildItem -Path $src -Recurse -Filter '*.nupkg' -File)
          if ($nupkgs.Count -eq 0) { throw "No mono-build component .nupkg found under $src (expected Component-*-Final)." }
          foreach ($p in $nupkgs) { Copy-Item -Path $p.FullName -Destination $store -Force }
          Write-Host "Staged $($nupkgs.Count) mono-build component packages into $store"
          $basePkg = Get-ChildItem -Path $store -Filter 'Microsoft.WindowsAppSDK.Base.*.nupkg' -File |
              Where-Object { $_.BaseName -match '^Microsoft\.WindowsAppSDK\.Base\.\d' } | Select-Object -First 1
          if (-not $basePkg) { throw "Microsoft.WindowsAppSDK.Base.<version>.nupkg not found in $store; cannot pin mono-build version." }
          $version = $basePkg.BaseName -replace '^Microsoft\.WindowsAppSDK\.Base\.', ''
          Write-Host "Pinning WindowsAppSDKVersionPinned to mono-build version: $version"
          Write-Host "##vso[task.setvariable variable=WindowsAppSDKVersionPinned]$version"

  - template: WinUI-InstallDependencies-Steps.yml

  # Download and extract nuget package with non-stubbed MicrosoftTelemetry.h header
  - task: DownloadPackage@1
    displayName: 'Download Microsoft.Telemetry.Inbox.Native'
    condition: and(succeeded(), ${{ eq(parameters.MUXFinalRelease, true) }}, ne(variables['Build.Repository.Provider'], 'GitHub'), ne(variables['Build.Repository.Provider'], 'GitHubEnterprise'))
    inputs:
      feed: '/3415933f-ac0d-4766-8c0a-3f4c247c25f5'                         # 0
      view: 'ef61a1c1-003b-4a27-bde5-beec8301021b'                          # Release
      definition: '2fe60c09-c66f-4275-ae2d-f015c7170c72'                    # Microsoft.Telemetry.Inbox.Native
      version: '10.0.18362.1-190318-1202.19h1-release.amd64fre'             # latest version
      downloadPath: '$(System.DefaultWorkingDirectory)'                     # download and extract to repo root

  # Replace the stubbed MicrosoftTelemetry.h with the real one
  # Delete the existing stubbed MicrosoftTelemetry.h first, to ensure that if it is no longer at the expected path that the task, and build, fails
  - script: |
     del $(System.DefaultWorkingDirectory)\controls\dev\Telemetry\MicrosoftTelemetry.h
     del $(System.DefaultWorkingDirectory)\dxaml\xcp\inc\telemetry\MicrosoftTelemetry.h
     copy /Y $(System.DefaultWorkingDirectory)\build\native\inc\MicrosoftTelemetry.h $(System.DefaultWorkingDirectory)\controls\dev\Telemetry\
     copy /Y $(System.DefaultWorkingDirectory)\build\native\inc\MicrosoftTelemetry.h $(System.DefaultWorkingDirectory)\dxaml\xcp\inc\telemetry\
    condition: and(succeeded(), ${{ eq(parameters.MUXFinalRelease, true) }}, ne(variables['Build.Repository.Provider'], 'GitHub'), ne(variables['Build.Repository.Provider'], 'GitHubEnterprise'))
    failOnStderr: true
    displayName: 'Replace existing stubbed MicrosoftTelemetry.h header with the real version from the nuget package'

  - powershell: |
      if ($env:LkgVcToolsName -eq $null)
      {
          $env:LkgVcToolsName  = '$(compilerOverridePackageName)'
      }
      if($env:LkgVcToolsVersion -eq $null)
      {
          $env:LkgVcToolsVersion = '$(compilerOverrideNupkgVersion)'
      }
      nuget install $env:LkgVcToolsName -version $env:LkgVcToolsVersion -source $(WinUILKGCompilerFeedUri) -ConfigFile $(Build.SourcesDirectory)\nuget.config
    displayName: Install native compiler override

  # Inject the Azure Maps token into the MapControl test page. Standalone only — the MapControl
  # test page is part of MUXControls.sln test infra which monobuild does NOT build (gated by IsMonobuild).
  - ${{ if ne(parameters.IsMonobuild, 'true') }}:
    - task: PowerShell@2
      displayName: 'Inject AzureMaps Token'
      condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
      inputs:
        filePath: 'scripts\InjectAzureMapsToken.ps1'
        arguments: "-MapsToken '$(WinUIAzureMapsKey)'"

  # When we build the XAML compiler as part of the same build that consumes the XAML compiler,
  # we can hit build breaks caused by MSBuild instances trying to produce DLLs that it's
  # already loaded.  To avoid that, we'll build the parts of the XAML compiler we need to build
  # before we build the solutions that consume them.
  #
  # XamlCompilerPrerequisites.sln builds the XAML compiler from the checked-out source for all
  # providers, including GitHub-backed builds, so validation uses a compiler built from the same
  # source revision being validated.  The solution also builds GenXbf (via the
  # BuildGenXbfForMSBuild project it contains), so no separate GenXbf step is needed.
  - template: WinUI-BuildProject-Steps.yml
    parameters:
      solutionName: XamlCompilerPrerequisites.sln
      solutionPath: $(Build.SourcesDirectory)
      nugetConfigPath: nuget.config
      msBuildArgs: '/p:MUXFinalRelease=${{ parameters.MUXFinalRelease }} ${{ parameters.pgoBuildModeMSBuildArg }} /m ${{parameters.additionalMSBuildOptions}}'
      msbuildInstallDir: $(_buildToolsDirectory)
      projectCaching: ${{ parameters.projectCaching }}
      runStaticAnalysis: ${{ parameters.runStaticAnalysis }}
      condition: succeeded()

  - ${{ if eq(parameters.buildProductOnly, 'false') }}:
    - template: WinUI-BuildProject-Steps.yml
      parameters:
        solutionName: Microsoft.UI.Xaml.sln
        solutionPath: $(Build.SourcesDirectory)\dxaml
        nugetConfigPath: nuget.config
        msBuildArgs: '/p:MUXFinalRelease=${{ parameters.MUXFinalRelease }} ${{ parameters.pgoBuildModeMSBuildArg }} /p:WinUIVersion=${{ parameters.winUIVersion }} /m ${{parameters.additionalMSBuildOptions}} /p:PublishAot=$(publishAotValue)'
        msbuildInstallDir: $(_buildToolsDirectory)
        projectCaching: ${{ parameters.projectCaching }}
        runStaticAnalysis: ${{ parameters.runStaticAnalysis }}
        ${{ if ne(parameters.consumeProductFromBuildId, '') }}:
          # Consuming the mono-build product: skip building it for the configs the mono-build
          # publishes (Release x86/x64/arm64); still build it for Debug / arm64ec.
          condition: and(succeeded(), or(ne(variables['normalizedConfiguration'],'fre'), not(in(variables['buildPlatform'],'x86','x64','arm64'))))
      # Build log is published by the WinUI-BuildProject-Steps.yml pipeline

    # Download the mono-build's WinUI product into BuildOutput\bin for the consumed configs so the
    # MUXControls.sln test build + scenario apps below compile against it (eng\consumebinaries.targets
    # references $(ArtifactsBinDir)\Product). Only emitted when consuming; standalone is unaffected.
    - ${{ if ne(parameters.consumeProductFromBuildId, '') }}:
      - task: DownloadPipelineArtifact@2
        displayName: 'Consume product: download Build-WinUI-$(buildPlatform)-Release from mono-build'
        condition: and(succeeded(), eq(variables['normalizedConfiguration'],'fre'), in(variables['buildPlatform'],'x86','x64','arm64'))
        inputs:
          source: specific
          runVersion: specific
          project: $(System.TeamProjectId)
          pipeline: ${{ parameters.consumeProductFromPipeline }}
          pipelineId: ${{ parameters.consumeProductFromBuildId }}
          artifactName: Build-WinUI-$(buildPlatform)-Release
          targetPath: $(Build.ArtifactStagingDirectory)\MonobuildProduct
      - task: PowerShell@2
        displayName: 'Consume product: lay mono-build product into BuildOutput\bin'
        condition: and(succeeded(), eq(variables['normalizedConfiguration'],'fre'), in(variables['buildPlatform'],'x86','x64','arm64'))
        inputs:
          targetType: inline
          script: |
            Set-StrictMode -Version 2.0
            $ErrorActionPreference = 'Stop'
            $flavor = "$(buildOutput)$(normalizedConfiguration)"
            $artRoot = "$(Build.ArtifactStagingDirectory)\MonobuildProduct"
            $binDst = "$(Build.SourcesDirectory)\BuildOutput\bin"

            # Build-WinUI-<plat>-Release stages BuildOutput\bin under drop_<flavor>\ (with the
            # <flavor>\ product tree and a sibling GenXBF\ folder), plus a top-level packaging\
            # folder (license.txt, AppxManifest, lib/runtimes) that the mock + component package
            # builds need at BuildOutput\packaging\<Configuration>\.
            $dropSrc = Join-Path $artRoot "drop_$flavor"
            if (-not (Test-Path (Join-Path $dropSrc $flavor))) {
                throw "Mono-build product not found at $dropSrc\$flavor (expected inside Build-WinUI-$(buildPlatform)-Release)."
            }
            New-Item -ItemType Directory -Force -Path $binDst | Out-Null
            # Copy the whole drop_<flavor> contents (the <flavor>\Product tree + GenXBF) into BuildOutput\bin.
            Copy-Item -Path "$dropSrc\*" -Destination $binDst -Recurse -Force
            Write-Host "Laid mono-build product bin into $binDst"

            # Lay the packaging output (license.txt etc.) into BuildOutput\packaging.
            $pkgSrc = Join-Path $artRoot 'packaging'
            $pkgDst = "$(Build.SourcesDirectory)\BuildOutput\packaging"
            if (Test-Path $pkgSrc) {
                New-Item -ItemType Directory -Force -Path $pkgDst | Out-Null
                Copy-Item -Path "$pkgSrc\*" -Destination $pkgDst -Recurse -Force
                Write-Host "Laid mono-build packaging into $pkgDst"
            } else {
                Write-Host "##[warning]No packaging\ folder in the mono-build artifact; mock/component package builds may fail."
            }

            $licenseProbe = "$pkgDst\$(buildConfiguration)\license.txt"
            Write-Host "license.txt present ($licenseProbe): $(Test-Path $licenseProbe)"

  - ${{ if eq(parameters.buildProductOnly, 'true') }}:
    - template: WinUI-BuildProject-Steps.yml
      parameters:
        solutionName: Microsoft.UI.Xaml-Product.sln
        solutionPath: $(Build.SourcesDirectory)
        nugetConfigPath: nuget.config
        msBuildArgs: '/p:MUXFinalRelease=${{ parameters.MUXFinalRelease }} ${{ parameters.pgoBuildModeMSBuildArg }} /p:WinUIVersion=${{ parameters.winUIVersion }} /m ${{parameters.additionalMSBuildOptions}} /p:PublishAot=$(publishAotValue)'
        msbuildInstallDir: $(_buildToolsDirectory)
        projectCaching: ${{ parameters.projectCaching }}
        runStaticAnalysis: ${{ parameters.runStaticAnalysis }}
      # Build log is published by the WinUI-BuildProject-Steps.yml pipeline

  # Standalone only - monobuild packs the per-platform bits in its own Pack stage instead.
  - ${{ if ne(parameters.IsMonobuild, 'true') }}:
    # Build WinUI component package before copying to output directory. The BuildScenarioApps
    # stage downloads this package and sample apps reference Microsoft.WindowsAppSDK.WinUI.
    # Monobuild centralizes the per-platform produced bits into Pack — see
    # WinUI-CreateTransportNupkg-Steps.yml (IsMonobuild=true path).
    - powershell: |
        if ($env:BUILD_REPOSITORY_PROVIDER -notin @('GitHub', 'GitHubEnterprise'))
        {
          & "$(Build.SourcesDirectory)\build\NuSpecs\build-nupkg.ps1" `
            -Nuspec Microsoft.WindowsAppSDK.WinUI.nuspec `
            -VersionOverride $(versionFinal) `
            -PackageRoot '$(Build.SourcesDirectory)\BuildOutput\packaging\$(buildConfiguration)' `
            -OutputDir '$(Build.SourcesDirectory)\PackageStore' `
            -InstallPackage
        }
        else
        {
          # -UseDependencyOverrides makes build-nupkg.ps1 read the OSS-pinned nodes, so the nupkg
          # declares public dependency versions instead of the internal ones, which are not on the
          # public feed.
          & "$(Build.SourcesDirectory)\build\NuSpecs\build-nupkg.ps1" `
            -Nuspec Microsoft.WindowsAppSDK.WinUI.nuspec `
            -VersionOverride $(versionFinal) `
            -PackageRoot '$(Build.SourcesDirectory)\BuildOutput\packaging\$(buildConfiguration)' `
            -OutputDir '$(Build.SourcesDirectory)\PackageStore' `
            -UseDependencyOverrides `
            -InstallPackage
        }
      displayName: Build WinUI component package

  # MUXControls.sln is test infra; monobuild skips it (depends on the AzureMaps token
  # and the WindowsAppSDKConfig overlay - both standalone-only).
  - ${{ if and(eq(parameters.buildProductOnly, 'false'), ne(parameters.IsMonobuild, 'true')) }}:
    - template: WinUI-BuildProject-Steps.yml
      parameters:
        solutionName: MUXControls.sln
        solutionPath: $(Build.SourcesDirectory)\controls
        nugetConfigPath: nuget.config
        msBuildArgs: '/p:MUXFinalRelease=${{ parameters.MUXFinalRelease }} ${{ parameters.pgoBuildModeMSBuildArg }} /p:DisableWarnForInvalidRestoreProjects=true /m ${{parameters.additionalMSBuildOptions}} /p:WinUIVersion=${{ parameters.winUIVersion }} /p:PublishAot=$(publishAotValue)'
        msbuildInstallDir: $(_buildToolsDirectory)
        projectCaching: ${{ parameters.projectCaching }}
        runStaticAnalysis: ${{ parameters.runStaticAnalysis }}

  # Build the two WinUI test-helper projects (mono-build only — standalone gets them from the full
  # MUXControls.sln build above). Runs after the product build so the WinUI component package
  # (built + installed inside this template) and product binaries are available.
  - ${{ if eq(parameters.IsMonobuild, 'true') }}:
    - template: WinUI-BuildTestInfra-Steps.yml
      parameters:
        winUIVersion: ${{ parameters.winUIVersion }}
        buildConfiguration: $(buildConfiguration)
        MUXFinalRelease: ${{ parameters.MUXFinalRelease }}
        additionalMSBuildOptions: ${{ parameters.additionalMSBuildOptions }}
        msbuildInstallDir: $(_buildToolsDirectory)

  # Tabular builds as part of MUXControls.sln. Microsoft.UI.Xaml.Controls.Tabular.vcxproj carries
  # build-order-only ProjectReferences to MergedWinMD and to MUXC's controls DLL, so the solution
  # graph sequences MUXC -> Tabular on its own and no separate solution or step is needed.

  - script: |
     dir /b /s $(Build.SourcesDirectory)\packages\*.nupkg
    displayName: 'List contents of packages dir'

  - ${{ if eq(parameters.buildScenarioApps, 'true') }}:
    - template: WinUI-BuildSampleApps-Steps.yml
      parameters:
        artifactsRoot: ${{ parameters.buildArtifactsDirectory }}\
        pipelineKind: ${{ parameters.pipelineKind }}
        MUXFinalRelease: ${{ parameters.MUXFinalRelease }}
        runStaticAnalysis: ${{ parameters.runStaticAnalysis }}

  # Cleanup before staging artifacts to free disk. Monobuild path keeps only .dotnet because
  # _enableVsBuildTools=false there (VS is preinstalled on the OneBranch image), so the
  # msbuildInstallDir / msbuildInstallLogsDir are not used.
  - ${{ if eq(parameters.IsMonobuild, 'true') }}:
    - script: |
        if exist .dotnet rmdir /s /q .dotnet
      displayName: Remove .NET SDK install to free up disk space
      continueOnError: true
  - ${{ else }}:
    - script: |
        if exist ${{ parameters.msbuildInstallDir }} rmdir /s /q ${{ parameters.msbuildInstallDir }}
        if exist ${{ parameters.msbuildInstallLogsDir }} rmdir /s /q ${{ parameters.msbuildInstallLogsDir }}
        if exist .dotnet rmdir /s /q .dotnet
      displayName: Remove VS build tools and .NET SDK installs to free up disk space

  # Copy built binaries to the staging directory. Monobuild appends a per-platform suffix
  # ('_$(buildOutput)$(normalizedConfiguration)') so PackWinUI can ingest x86/x64/arm64
  # artifacts side by side. Standalone is single-platform per job and uses bare '\drop'.
  - task: CopyFiles@2
    displayName: 'Copy built binaries to artifact staging directory'
    condition: always()
    inputs:
      sourceFolder: ${{ parameters.buildArtifactsDirectory }}\bin
      # Stage everything that was produced except symbols, which we publish to a different artifact
      contents: |
        **\*
        !**\*.pdb
      targetFolder: $(ob_outputDirectory)\drop${{ parameters.dropSuffix }}

  # An app that includes the transport package won't run properly if these files aren't present,
  # since then they're part of the NuGet package that are detected to be missing.
  # Monobuild skips this because the source path (MUXControlsTestApp under UnpackagedApps)
  # is produced by MUXControls.sln, which monobuild does not build.
  - ${{ if and(eq(parameters.buildProductOnly, 'false'), ne(parameters.IsMonobuild, 'true')) }}:
    - task: CopyFiles@2
      displayName: 'Copy Microsoft.WindowsAppSDK.Foundation.TransportPackage symbols to artifact staging directory'
      condition: and(always(), ne(variables['Build.Repository.Provider'], 'GitHub'), ne(variables['Build.Repository.Provider'], 'GitHubEnterprise'))
      inputs:
        sourceFolder: ${{ parameters.buildArtifactsDirectory }}\bin\$(buildOutput)$(normalizedConfiguration)\Test\UnpackagedApps\MUXControlsTestApp
        contents: |
          *.pdb
          !AppTestAutomationHelpers.pdb
          !Microsoft.WinUI.pdb
          !MUXControlsTestApp.pdb
        targetFolder: $(ob_outputDirectory)\drop${{ parameters.dropSuffix }}\$(buildOutput)$(normalizedConfiguration)\Test\UnpackagedApps\MUXControlsTestApp

  - task: PowerShell@2
    displayName: 'Generate fusion manifest'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        $targetsFilePath = "${{ parameters.buildArtifactsDirectory }}\packaging\$(buildConfiguration)"
        $manifestPath = $targetsFilePath+'\manifests';
        New-Item -ItemType Directory -Force -Path $manifestPath;
        $xslt = New-Object System.Xml.Xsl.XslCompiledTransform;
        $xslt.Load('build\TransformAppxManifest.xslt');
        $xslt.Transform($targetsFilePath+'\AppxManifest.xml', $manifestPath+'\Microsoft.WindowsAppSdk.WinUI.manifest');

  - task: CopyFiles@2
    displayName: 'Copy packaging output to artifact staging directory'
    condition: and(succeeded(), eq(variables['buildConfiguration'], 'Release'))
    inputs:
      sourceFolder: ${{ parameters.buildArtifactsDirectory }}\packaging\
      # We only want to copy GenXbf from the packaging output if its target architecture
      # actually matches the target architecture of the current build (that is, it exists
      # because it is an intended product binary, not a side effect of needing to satisfy
      # a build-time dependency)
      contents: |
        **\*
        !**\*.pdb
        !**\tools\!($(buildPlatform))\GenXbf.dll
      targetFolder: $(ob_outputDirectory)\packaging

  - task: PublishSymbols@2
    displayName: 'Publish full symbols to internal symbol server'
    condition: and(succeeded(), ne(variables['Build.Repository.Provider'], 'GitHub'), ne(variables['Build.Repository.Provider'], 'GitHubEnterprise'))
    inputs:
      SearchPattern: '${{ parameters.buildArtifactsDirectory }}\bin\$(buildOutput)$(normalizedConfiguration)\Symbols\Product\**\*.pdb'
      SymbolServerType: 'TeamServices'
    # There is a bug which causes this task to fail if LIB includes an inaccessible path (even though it does not depend on it).
    # To work around this issue, we just force LIB to be any dir that we know exists.
    env:
      LIB: $(Build.SourcesDirectory)

  # Test infra symbols come from MUXControls.sln, which monobuild does not build.
  - ${{ if and(eq(parameters.buildProductOnly, 'false'), ne(parameters.IsMonobuild, 'true')) }}:
    - task: PublishSymbols@2
      displayName: 'Publish test infra symbols to internal symbol server'
      condition: and(succeeded(), ne(variables['Build.Repository.Provider'], 'GitHub'), ne(variables['Build.Repository.Provider'], 'GitHubEnterprise'))
      inputs:
        SearchPattern: '${{ parameters.buildArtifactsDirectory }}\bin\$(buildOutput)$(normalizedConfiguration)\Symbols\Test\TestInfra\**\*.pdb'
        SymbolServerType: 'TeamServices'
      env:
        LIB: $(Build.SourcesDirectory)

  # Copying symbols to build artifacts must happen *after* they have been indexed
  - task: CopyFiles@2
    displayName: 'Copy symbols to output directory'
    condition: succeeded()
    inputs:
      SourceFolder: '${{ parameters.buildArtifactsDirectory }}\bin\$(buildOutput)$(normalizedConfiguration)\Symbols'
      TargetFolder: '$(ob_outputDirectory)\Symbols'

  # Copy Product binaries for APIScan. To save time/resources, not running APIScan on Samples apps for now.
  # We are using this copy as a way to focus on scanning product code only and also a workaround for an APIScan limitation:
  # Currently, if the softwareFolder parameter we pass to APIScan is a folder that does not exist, APIScan throws an error.
  # This pipeline currently builds the ...\x86chk\Product\..., ...\x64fre\Product\..., etc. permutations on differrent job agents,
  # therefore, if the softwareFolder parameter simply contains a full list of all such folders, most of them will be "not found" on
  # a specific build agent. OTOH, if we set softwareFolder to "${{ parameters.buildArtifactsDirectory }}\bin" then we can't focus
  # on the product code, because Guardian's APIScan currently does not support parameters like "excludes", "excludePath",
  # and "analyzeTargetGlob".
  - ${{ if eq(parameters.runStaticAnalysis, 'true') }}:
    # This is a temp step for improving performance.
    # For platform + config combos that we currently choose to skip APIScan, we still put a single dll at the target folder
    # for APIScan to find, because when the target folder does not exist or no binary is found there, APIScan throws an error.
    # Guardian APIScan does not seem to support disabling APIScan on a per-job basis when a matrix is involved (but it works fine
    # when a matrix isn't involved) which is the case here, hence resorting to this workaround until a better solution emerges.
    # One simple way to eliminate this workaround is to relex the "condition:" in the following CopyFiles task to unblock
    # scanning binaries for all permutations.
    - task: CopyFiles@2
      displayName: 'Copy GenXbf.dll to APIScanTarget directory'
      inputs:
        sourceFolder: ${{ parameters.buildArtifactsDirectory }}\bin\GenXBF\$(buildPlatform)
        contents: |
          GenXbf.dll
        targetFolder: ${{ parameters.buildArtifactsDirectory }}\APIScanTarget
      continueOnError: true

    # Feed the actual binaries to APIScan via this copy, whose scope is easy to adjust.
    - task: CopyFiles@2
      displayName: 'Copy Product binaries to APIScanTarget directory'
      condition: and(succeeded(), eq(variables['buildOutput'], 'amd64'), eq(variables['normalizedConfiguration'], 'fre'))
      inputs:
        sourceFolder: ${{ parameters.buildArtifactsDirectory }}\bin\$(buildOutput)$(normalizedConfiguration)\Product
        contents: |
          **\*
          !**\*.pdb
        targetFolder: ${{ parameters.buildArtifactsDirectory }}\APIScanTarget
      continueOnError: true

  # ESRP signing — WinUI binaries. Routed through WinUI-EsrpCodeSigning-Wrapper.yml (same-repo relative
  # ref), which dispatches the shared signing template to @self (monobuild) or @WinAppSDK (standalone),
  # so this runs in BOTH contexts with no dependence on the legacy WindowsAppSDKConfig repo.
  - ${{ if eq(parameters.signOutput, true) }}:
    - template: WinUI-EsrpCodeSigning-Wrapper.yml
      parameters:
        IsMonobuild: ${{ parameters.IsMonobuild }}
        InnerParams:
          FolderPath: '$(ob_outputDirectory)'
          Pattern: |
            **/Microsoft.WinUI.dll
            **/Microsoft.UI.Text.winmd
            **/Microsoft.UI.Xaml.winmd
            **/Microsoft.UI.Xaml.Controls.dll
            **/Microsoft.UI.Xaml.Controls.Tabular.dll
            **/Microsoft.ui.xaml.dll
            **/Microsoft.ui.xaml.dll.mui
            **/Microsoft.UI.Xaml.Internal.dll
            **/Microsoft.UI.Xaml.Phone.dll
            **/Microsoft.UI.Xaml.Phone.dll.mui
            **/Microsoft.ui.xaml.resources.19h1.dll
            **/Microsoft.ui.xaml.resources.common.dll
            **/WinUIEdit.dll
            **/Microsoft.UI.Xaml.Markup.Compiler.dll
            **/Microsoft.UI.Xaml.Markup.Compiler.IO.dll
            **/Microsoft.UI.Xaml.Markup.Compiler.MSBuildInterop.dll
            **/Microsoft.UI.Xaml.Design.dll
            **/XamlCompiler.exe
            **/GenXbf.dll
            **/Add-AppDevPackage.psd1
          KeyCode: 'CP-230012'
          UseMinimatch: true
          DisplayName: 'CodeSign WinUI binaries'
