parameters:
  pipelineKind: ''
  useCsWinRT3: false
  stageName: RunTests
  dependsOn: Build
  testPayloadArtifactName: TestPayload
  runArtifactNamespace: RunTestsStage

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.stageName }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: not(failed())
  jobs:
  - template: WinUI-CreateTestPayload-Job.yml
    parameters:
      runTestJobName: CreateTestPayload
      pipelineKind: ${{ parameters.pipelineKind }}
      testSuite: 'DevTestSuite'
      testPayloadArtifactName: ${{ parameters.testPayloadArtifactName }}
      useCsWinRT3: ${{ parameters.useCsWinRT3 }}

  - template: WinUI-RunTestPassOnPipeline-Job.yml
    parameters:
      runTestJobName: RunTests25H2
      runTestStageName: ${{ parameters.runArtifactNamespace }}
      dependsOn: CreateTestPayload
      testOS: 'Win11-25H2'
      testPayloadArtifactName: ${{ parameters.testPayloadArtifactName }}

  - ${{ if ne(parameters.pipelineKind, 'QuickPR') }}:
    - template: WinUI-RunTestPassOnPipeline-Job.yml
      parameters:
        runTestJobName: RunTests23H2
        runTestStageName: ${{ parameters.runArtifactNamespace }}
        dependsOn: CreateTestPayload
        testOS: 'Win11-23H2'
        testPayloadArtifactName: ${{ parameters.testPayloadArtifactName }}

    - template: WinUI-RunTestPassOnPipeline-Job.yml
      parameters:
        runTestJobName: RunTestsRS5
        runTestStageName: ${{ parameters.runArtifactNamespace }}
        dependsOn: CreateTestPayload
        testOS: 'Win10-RS5'
        testPayloadArtifactName: ${{ parameters.testPayloadArtifactName }}