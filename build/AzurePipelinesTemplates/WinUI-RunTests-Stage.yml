parameters:
  pipelineKind: ''
  collectCodeCoverage: false

stages:
- stage: RunTests
  displayName: Run Tests Stage
  dependsOn: Build
  condition: not(failed())
  jobs:
  - template: WinUI-CreateTestPayload-Job.yml
    parameters:
      runTestJobName: CreateTestPayload
      pipelineKind: ${{ parameters.pipelineKind }}
      testSuite: 'DevTestSuite'
      testPayloadArtifactName: 'TestPayload'
      collectCodeCoverage: ${{ parameters.collectCodeCoverage }}

  - template: WinUI-RunTestPassOnPipeline-Job.yml
    parameters:
      runTestJobName: RunTests25H2
      dependsOn: CreateTestPayload
      testOS: 'Win11-25H2'
      testPayloadArtifactName: 'TestPayload'
      collectCodeCoverage: ${{ parameters.collectCodeCoverage }}

  - ${{ if ne(parameters.pipelineKind, 'QuickPR') }}:
    - template: WinUI-RunTestPassOnPipeline-Job.yml
      parameters:
        runTestJobName: RunTests23H2
        dependsOn: CreateTestPayload
        testOS: 'Win11-23H2'
        testPayloadArtifactName: 'TestPayload'
        collectCodeCoverage: ${{ parameters.collectCodeCoverage }}

    - template: WinUI-RunTestPassOnPipeline-Job.yml
      parameters:
        runTestJobName: RunTestsRS5
        dependsOn: CreateTestPayload
        testOS: 'Win10-RS5'
        testPayloadArtifactName: 'TestPayload'
        collectCodeCoverage: ${{ parameters.collectCodeCoverage }}

  - ${{ if eq(parameters.collectCodeCoverage, true) }}:
    - template: WinUI-MergeCodeCoverage-Job.yml
      parameters:
        dependsOn:
        - RunTests25H2
        - ${{ if ne(parameters.pipelineKind, 'QuickPR') }}:
          - RunTests23H2
          - RunTestsRS5