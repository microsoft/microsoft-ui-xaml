parameters:
- name: stageName
  type: string
  default: 'Source'
- name: jobName
  type: string
  default: 'PublishSource'
- name: targetRepositoryBranchName
  type: string
  default: 'winui3/main'
- name: exclusionPathspecsFile
  type: string
  default: 'build\PipelineScripts\WinUISourceMirroringExclusions.txt'
- name: restorePathspecsFile
  type: string
  default: 'build\PipelineScripts\WinUISourceMirroringRestorePaths.txt'
- name: targetRepositorySubdirectory
  displayName: Subdirectory to mirror source code into (optional)
  type: string
  default: " "
- name: mergeToMain
  displayName: Merge target branch to main?
  type: string
  default: never
  values:
  - automatic
  - always
  - never
- name: useTriggeringBranchExclusions
  displayName: Use the triggering branch's exclusions file instead of the version corresponding to the source committish
  type: boolean
  default: false

stages:
- stage: ${{ parameters.stageName }}
  dependsOn: []
  jobs:
  - job: ${{ parameters.jobName }}
    pool:
      type: windows
    timeoutInMinutes: 120
    variables:
      ob_outputDirectory: '$(Build.SourcesDirectory)\out' # The pipeline template requires this variable to be defined
      ob_git_skip_checkout_none: true # we checkout repositories ourselves
      # Repo paths are defined relative to the pipeline's workspace, $(Pipeline.Workspace)
      selfRepoRelativePath: 's\self'
      selfRepoRef: '$[ resources.repositories.self.ref ]'
      sourceRepoRelativePath: 's\source'
      sourceRepoRef: '$[ resources.repositories.sourceRepository.ref ]'
      targetRepoRelativePath: 's\target'
      targetRepoRef: '$[ resources.repositories.targetRepository.ref ]'
      targetRepoName: '$[ resources.repositories.targetRepository.name ]'
      ${{ if eq(parameters.useTriggeringBranchExclusions, true) }}:
        useExclusionsFileFromSelfRepoArg: '-UseExclusionsFileFromSelfRepo'
      ${{ else }}:
        useExclusionsFileFromSelfRepoArg: ' '
      ${{ if ne(parameters.targetRepositorySubdirectory, ' ') }}:
        targetRepositorySubdirectoryArg: '-TargetRepositorySubdirectory ${{ parameters.targetRepositorySubdirectory }}'
      ${{ else }}:
        targetRepositorySubdirectoryArg: ' '
    steps:
    - checkout: self
      submodules: false
      fetchDepth: 1
      fetchTags: false
      path: '$(selfRepoRelativePath)'
      displayName: Checkout self repository '$(selfRepoRelativePath)'
    - checkout: sourceRepository
      submodules: false
      persistCredentials: true
      fetchDepth: 0
      path: '$(sourceRepoRelativePath)'
      displayName: Checkout source repository '$(sourceRepoRelativePath)'
    - checkout: targetRepository
      submodules: false
      persistCredentials: true
      fetchDepth: 0
      path: '$(targetRepoRelativePath)'
      displayName: Checkout target repository '$(targetRepoRelativePath)'

    - script: set
      displayName: Display machine environment variables

    # This keeps Guardian happy by allowing it to find the TSA config
    - task: CopyFiles@2
      displayName: Copy `.config\` to `$(Build.SourcesDirectory)`
      inputs:
        SourceFolder: '$(Pipeline.Workspace)\$(selfRepoRelativePath)'
        TargetFolder: '$(Build.SourcesDirectory)'
        Contents: |
          .config\**

    - task: PowerShell@2
      displayName: Mirror source code
      inputs:
        workingDirectory: '$(Pipeline.Workspace)'
        filePath: '$(Pipeline.Workspace)\$(selfRepoRelativePath)\scripts\MirrorGitRepositoryWithoutHistory.ps1'
        arguments: >
          -SelfRepositoryDirectory $(selfRepoRelativePath)
          -SourceRepositoryDirectory $(sourceRepoRelativePath)
          -SourceRepositoryCommittish 'HEAD'
          -TargetRepositoryDirectory $(targetRepoRelativePath)
          -TargetRepositoryBranchName '${{ parameters.targetRepositoryBranchName }}'
          -MergeBackToDefaultBranch ${{ parameters.mergeToMain }}
          -ExclusionPathspecsFile ${{ parameters.exclusionPathspecsFile }}
          -RestorePathspecsFile ${{ parameters.restorePathspecsFile }}
          -ComputeCommitDescription
          $(useExclusionsFileFromSelfRepoArg)
          $(targetRepositorySubdirectoryArg)
