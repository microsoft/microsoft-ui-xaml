parameters:
  buildConfiguration: fre
  buildOutput: amd64
  artifactNamePrefix: drop_BuildScenarioApps
  # Use test binaries from drop_cswinrt3 instead of drop.
  useCsWinRT3: false

jobs:
- job: ScenarioAppUnitTests
  condition: not(failed())
  pool:
    type: windows
    isCustom: true
    name: WinDevPool-L
    demands: ImageOverride -equals WinDevVS17-latest

  variables:
    artifactName: ${{parameters.artifactNamePrefix}}_${{parameters.buildOutput}}${{parameters.buildConfiguration}}
    ${{ if eq(parameters.useCsWinRT3, true) }}:
      dropSubfolder: 'drop_cswinrt3'
    ${{ else }}:
      dropSubfolder: 'drop'
    testDir: $(Build.ArtifactStagingDirectory)\$(dropSubfolder)\${{parameters.buildOutput}}${{parameters.buildConfiguration}}\Samples\WinUICsUnitTestApp_Test

  steps:
  - template: WinUI-DownloadPipelineArtifacts-Steps.yml
    parameters:
      artifactName: $(artifactName)
      targetPath: '$(Build.ArtifactStagingDirectory)'
      itemPattern: '**/@(WinUICsUnitTestApp_Test)/**'
      enableUseOutputFromPreviousBuild: true

  - script: |
     dir /b /s $(Build.ArtifactStagingDirectory)
    displayName: 'List contents of ArtifactStagingDirectory'

  - script: |
     reg add HKLM\Software\Policies\Microsoft\Windows\Appx /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
    displayName: 'Enable AllowDevelopmentWithoutDevLicense reg key'

  - powershell: |
      cd $(testDir)
      # Install any .cer files that were included in the payload:
      foreach($cerFile in (Get-ChildItem "*.cer"))
      {
          Write-Host "Adding cert '$cerFile'"
          certutil -addstore TrustedPeople "$cerFile"
      }
    displayName: "Install any .cer files that were included in the payload:"

  - task: VSTest@2
    displayName: 'Run Scenario App Unit Tests'
    inputs:
      testRunTitle: WinUICsUnitTestApp
      failOnMinTestsNotRun: true
      # CsWinRT 3.0: the [UITestMethod] test (WinUICsUnitTestApp SampleTest2) is compiled out because the MSTest
      # UITestMethod attribute is not built for CsWinRT 3.0 yet, leaving only the single [TestMethod] (SampleTest1).
      # Lower the minimum to 1 for the v3 run so the stage still guards against zero tests executing. Restore to 2
      # once UITestMethod is available for CsWinRT 3.0 and SampleTest2 is re-enabled.
      ${{ if eq(parameters.useCsWinRT3, true) }}:
        minimumExpectedTests: '1'
      ${{ else }}:
        minimumExpectedTests: '2'
      rerunFailedTests: true
      configuration: ${{parameters.buildConfiguration}}
      platform: ${{parameters.buildOutput}}
      testAssemblyVer2: |
        $(testDir)\*.msix