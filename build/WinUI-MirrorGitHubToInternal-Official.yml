# Mirrors the public GitHub main branch to its internal Azure Repos mirror branch.
#
# This is intentionally history-preserving and fast-forward-only. The target
# branch must not contain ADO-only commits or files; exact mirrors cannot
# preserve target-only content. This pipeline publishes when run. It must be
# defined from the public GitHub repository so CI runs directly when main
# advances.
#
# A second stage then integrates github/internal/main into the internal
# integration branch (main) via a --no-ff merge, so a single run performs both
# legs (fast-forward mirror, then integrate). The integrate stage takes an
# exclusive lock (lockBehavior: runLatest) so concurrent runs cannot race.

trigger:
  batch: true
  branches:
    include:
    - main
pr: none

variables:
- group: WinUI-InternalFeed
- template: AzurePipelinesTemplates\WinUI-BuildVariables.yml

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: targetRepository
      type: git
      name: WinUI/microsoft-ui-xaml-lift
      ref: refs/heads/main

extends:
  template: v2/Microsoft.Official.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      ensureArtifactsDirExists: true
      WindowsHostVersion:
        Version: 2022
        Network: KS3
    platform:
      name: 'windows_undocked'
    globalsdl:
      tsa:
        enabled: false
      evidence:
        enabled: false
      evidenceV2:
        enabled: false
    git:
      submodules: false
      persistCredentials: true

    stages:
    - template: AzurePipelinesTemplates\WinUI-MirrorGitHubToInternal-Stage.yml@self
      parameters:
        sourceBranchName: user/gpaskaleva/mirror-e2e
        targetBranchName: user/gpaskaleva/github-internal-main-test
    # TODO: switch targetBranchName to main once the mirror pipeline identity has push/bypass permission on main.
    - template: AzurePipelinesTemplates\WinUI-PublicMirrorMerge-Stage.yml@self
      parameters:
        sourceBranchName: user/gpaskaleva/github-internal-main-test
        targetBranchName: user/gpaskaleva/mirror-integration-target
        dependsOnStage: Source
        checkoutRepository: targetRepository
