# Area ownership map for automatic *optional* reviewer suggestions.
#
# Consumed by .github/workflows/area-reviewers.yml. Every area whose globs match a
# changed file contributes its reviewers (union, not first-match). Reviewers are
# only *requested* - they never block a merge. The `* @microsoft/tm-winui` entry in
# .github/CODEOWNERS remains the authoritative safety net.
#
# `reviewers` are GitHub handles. A handle that is not a repository collaborator
# is skipped by the workflow rather than failing the run.
#
# Source of truth for the area breakdown: WinUI-Area-Ownership spreadsheet.

