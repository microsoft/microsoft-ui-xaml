# PR build (OSS). Product-only compile gate; tests and signing run in internal ADO.
#
# This is the only validation a fork pull request gets automatically. Azure Pipelines
# withholds secrets and service connections from fork-sourced builds, so the
# WinUI-GitHub-PR (OneBranch) pipeline fails at tool install for them; full validation
# has to be requested by a maintainer via fork-pr-validation.yml, which needs a
# credential this workflow deliberately does not have. Keep this one secretless:
# use the `pull_request` trigger (never `pull_request_target`), read-only permissions,
# GitHub-hosted runners, and the anonymously readable shine-oss dependency feed.

name: PR Build

on:
  pull_request:
    branches:
      - main
      - winui3/main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/policies/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'PRIVACY.md'
      - 'privacy.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTING_feedback_and_requests.md'
  workflow_dispatch: {}

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Kill switch retained from #11360. Set to 'true' to make every matrix leg a no-op
# without editing the trigger or disturbing required status checks.
env:
  DISABLE_PR_BUILD_MATRIX_VALIDATION: 'false'

jobs:
  build:
    name: Build (${{ matrix.flavor }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: x86chk
            platform: x86
            configuration: Debug
          - flavor: x86fre
            platform: x86
            configuration: Release
          - flavor: x64chk
            platform: x64
            configuration: Debug
          - flavor: x64fre
            platform: x64
            configuration: Release
          - flavor: arm64chk
            platform: arm64
            configuration: Debug
          - flavor: arm64fre
            platform: arm64
            configuration: Release
    env:
      WINUI_INIT_FLAVOR: ${{ matrix.flavor }}
      WINUI_BUILD_PLATFORM: ${{ matrix.platform }}
      WINUI_BUILD_CONFIGURATION: ${{ matrix.configuration }}
      BuildPlatform: ${{ matrix.platform }}
      NUGET_PACKAGES: ${{ github.workspace }}\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Cap CL.exe parallelism: hosted runner has 2 vCPUs; default /m:4 OOMs (C1076).
      CL: '/MP2'

    steps:
      - name: Skip disabled PR Build validation
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION == 'true'
        shell: pwsh
        run: Write-Host "PR Build matrix validation is disabled by DISABLE_PR_BUILD_MATRIX_VALIDATION."

      - name: Checkout
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false

      - name: Initialize build environment and build
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        shell: pwsh
        run: |
          & "${{ github.workspace }}/.github/scripts/build-pr.ps1" `
            -Flavor $env:WINUI_INIT_FLAVOR `
            -Platform $env:WINUI_BUILD_PLATFORM `
            -Configuration $env:WINUI_BUILD_CONFIGURATION

      - name: Upload MSBuild binlogs
        if: failure() && env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: binlogs-${{ matrix.flavor }}
          path: BuildOutput/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload product runtime payload
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: winui-product-${{ matrix.flavor }}
          path: |
            BuildOutput/packaging/${{ matrix.configuration }}/runtimes-framework/win-${{ matrix.platform }}/**
          if-no-files-found: warn
          retention-days: 7
