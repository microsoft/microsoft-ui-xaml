name: Duplicate issue detection

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: duplicate-detection-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  detect:
    # Issue text is untrusted input, so this job only reads and never writes.
    #
    # Only issues created from the bug report or feature proposal templates are
    # considered. Both templates apply `needs-triage`. Tracking epics generate large
    # families of near-identical sub-tasks that carry no labels; scoring them produced
    # almost entirely false positives during evaluation.
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.labels.*.name, 'needs-triage') ||
       contains(github.event.issue.labels.*.name, 'bug') ||
       contains(github.event.issue.labels.*.name, 'feature proposal'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      found: ${{ steps.detect.outputs.found }}
      comment: ${{ steps.detect.outputs.comment }}
      numbers: ${{ steps.detect.outputs.numbers }}
      top_number: ${{ steps.detect.outputs.top_number }}
      top_confidence: ${{ steps.detect.outputs.top_confidence }}
      top_reason: ${{ steps.detect.outputs.top_reason }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - id: detect
        run: python3 .github/scripts/issue-triage/find_duplicates.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SIMILARITY_THRESHOLD: "0.62"

  publish:
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment with possible duplicates
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COMMENT_BODY: ${{ needs.detect.outputs.comment }}
        with:
          script: |
            const marker = '<!-- winui-duplicate-detection:v1 -->';
            const body = process.env.COMMENT_BODY;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            // Re-check state in the write job instead of trusting the detect job.
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.state !== 'open') {
              core.info(`Issue #${issue_number} is no longer open. Skipping.`);
              return;
            }
            if (!body || !body.includes(marker)) {
              core.setFailed('Detector produced no canonical comment body.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created duplicate-detection comment.');
            } else if (existing.body.trim() !== body.trim()) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated comment ${existing.id}.`);
            } else {
              core.info('Existing comment is already current.');
            }

      # Submits GitHub's native duplicate suggestion, which renders an accept/decline
      # "agent suggestion" chip on the issue so a maintainer can confirm and close in one
      # click. `suggest: true` means GitHub holds the close for human review instead of
      # applying it. Approach adapted from the issue-triage workflow in microsoft/PowerToys.
      #
      # Pending suggestions are not exposed through REST, only through the GraphQL
      # `pendingSuggestions` union, which this step uses both to stay idempotent and to
      # confirm the suggestion actually landed.
      - name: Suggest duplicate for maintainer review
        if: needs.detect.outputs.top_confidence == 'HIGH' && env.ENABLE_DUPLICATE_SUGGESTION == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ENABLE_DUPLICATE_SUGGESTION: "true"
          TOP_NUMBER: ${{ needs.detect.outputs.top_number }}
          TOP_REASON: ${{ needs.detect.outputs.top_reason }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const canonicalNumber = Number(process.env.TOP_NUMBER);
            if (!Number.isInteger(canonicalNumber) || canonicalNumber <= 0) {
              core.setFailed('Invalid canonical issue number.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.state !== 'open') {
              core.info('Issue is no longer open. Skipping suggestion.');
              return;
            }

            // The API needs the canonical issue's id, and it must not be a pull request.
            let canonical;
            try {
              canonical = (await github.rest.issues.get({
                owner, repo, issue_number: canonicalNumber,
              })).data;
            } catch (error) {
              if (error.status === 404) {
                core.info(`#${canonicalNumber} no longer exists. Skipping suggestion.`);
                return;
              }
              throw error;
            }
            if (canonical.pull_request) {
              core.info(`#${canonicalNumber} is a pull request. Skipping suggestion.`);
              return;
            }

            // Pending suggestions are only visible through GraphQL. Reuse this query both
            // before the write, to skip redundant or competing writes, and after it, to
            // confirm the suggestion was actually recorded.
            const pendingQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    pendingSuggestions {
                      __typename
                      ... on PendingCloseSuggestion {
                        stateReason
                        actor { login }
                        duplicateOf { ... on Issue { number } }
                      }
                    }
                  }
                }
              }`;

            // GitHub keys pending suggestions by actor: re-submitting as the same actor
            // replaces the previous entry, while a different actor gets its own.
            const isOurs = (suggestion) =>
              (suggestion.actor?.login ?? '').startsWith('github-actions');

            async function pendingDuplicateSuggestions() {
              const result = await github.graphql(pendingQuery, {
                owner, repo, number: issue_number,
              });
              const pending = result?.repository?.issue?.pendingSuggestions ?? [];
              return pending.filter(
                (suggestion) =>
                  suggestion.__typename === 'PendingCloseSuggestion' &&
                  suggestion.stateReason === 'DUPLICATE'
              );
            }

            const existing = await pendingDuplicateSuggestions();

            // A human already proposed a duplicate here. Do not compete with them.
            if (existing.some((s) => !isOurs(s))) {
              core.info(
                'A duplicate suggestion from another actor is already pending. Skipping.'
              );
              return;
            }
            if (existing.some((s) => isOurs(s) && s.duplicateOf?.number === canonicalNumber)) {
              core.info(
                `A duplicate suggestion pointing at #${canonicalNumber} is already pending. Nothing to do.`
              );
              return;
            }

            const startedAt = Math.floor(Date.now() / 1000);
            const response = await github.request(
              'PATCH /repos/{owner}/{repo}/issues/{issue_number}',
              {
                owner,
                repo,
                issue_number,
                state: {
                  value: 'closed',
                  rationale: `${process.env.TOP_REASON} Suggested canonical issue: #${canonicalNumber}.`,
                  confidence: 'HIGH',
                  suggest: true,
                },
                state_reason: 'duplicate',
                duplicate_issue_id: canonical.id,
                headers: {
                  accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10',
                },
              }
            );

            // `suggest: true` must not close the issue. If GitHub applied the close
            // anyway, undo it rather than leaving a bot-closed issue behind.
            if (response.data?.state === 'closed') {
              const { data: current } = await github.rest.issues.get({
                owner, repo, issue_number,
              });
              const closedAt = Date.parse(current.closed_at);
              const closedByThisRequest =
                current.state === 'closed' &&
                current.closed_by?.login === 'github-actions[bot]' &&
                Number.isFinite(closedAt) &&
                Math.floor(closedAt / 1000) >= startedAt;
              if (closedByThisRequest) {
                await github.rest.issues.update({
                  owner, repo, issue_number, state: 'open',
                });
                core.setFailed(
                  'GitHub applied the close instead of holding it for review; the issue was reopened.'
                );
              } else {
                core.setFailed(
                  'Issue is closed after the duplicate suggestion, but this request did not cause it; leaving it alone.'
                );
              }
              return;
            }

            core.info(`Submitted duplicate suggestion pointing at #${canonicalNumber}.`);

            // `suggest: true` returns HTTP 200 whether or not a suggestion was recorded,
            // so confirm through GraphQL instead of trusting the status code.
            const recorded = await pendingDuplicateSuggestions();
            if (!recorded.some((s) => s.duplicateOf?.number === canonicalNumber)) {
              core.setFailed(
                `The API accepted the request but no pending duplicate suggestion for ` +
                `#${canonicalNumber} is recorded on this issue.`
              );
              return;
            }

            core.notice(
              `Duplicate suggestion pointing at #${canonicalNumber} is pending maintainer review.`
            );
