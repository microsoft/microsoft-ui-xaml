name: Issue triage script tests

on:
  pull_request:
    paths:
      - ".github/scripts/issue-triage/**"
      - ".github/workflows/duplicate-issue-detection.yml"
      - ".github/workflows/issue-triage-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - run: python -m unittest discover -s .github/scripts/issue-triage/tests -v
