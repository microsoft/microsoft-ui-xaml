name: WinUI validation tests

on:
  pull_request:
    paths:
      - '.github/scripts/winui-validation*'
      - '.github/scripts/tests/winui-validation*'
      - '.github/workflows/winui-validation*.yml'
      - 'build/WinUI-GitHub-PR.yml'
      - 'build/AzurePipelinesTemplates/WinUI-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --prefix .github/scripts --ignore-scripts
      - run: node --test .github/scripts/tests/winui-validation*.test.mjs
